<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>怪盗館長と幻のサンダル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one 16-bit style game screen (15x11 tiles) centered, touch pad underneath. Deliberately single dark look. */
:root{
  --night:#07060f;    /* page ground */
  --win-a:#2b2d7c;    /* window gradient top */
  --win-b:#0d0e34;    /* window gradient bottom */
  --edge:#efeaff;     /* window border, text */
  --edge-dark:#04041a;
  --gold:#ffd25a;     /* cursor, names, highlights */
  --pink:#ff7fb6;     /* logo accent, pink room */
  --muted:#9a96c0;
  --danger:#ff7a6a;
  --hp:#6ee07a;
  --mp:#6ab0ff;
  --font-game:"DotGothic16","MS Gothic","Osaka-Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#1a1636 0%,var(--night) 60%);color:var(--edge);font-family:var(--font-game)}
#app{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:16px;padding-inline:16px}
#screen{position:relative;width:100%;max-width:768px;aspect-ratio:480/352;container-type:inline-size;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px #2a2648,0 0 0 6px #0c0a1c,0 16px 50px rgba(0,0,0,.7);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#layer{position:absolute;inset:0;font-size:3.5cqw;line-height:1.55;pointer-events:none}
.win{position:absolute;box-sizing:border-box;color:var(--edge);background:linear-gradient(180deg,var(--win-a),var(--win-b));border:.5cqw solid var(--edge);border-radius:1.1cqw;box-shadow:0 0 0 .4cqw var(--edge-dark),inset 0 0 0 .35cqw rgba(0,0,0,.35),0 1cqw 0 rgba(0,0,0,.35);padding:1.4cqw 2.2cqw;pointer-events:auto;text-shadow:.28cqw .28cqw 0 rgba(0,0,0,.6)}
.msg{left:3%;right:3%;bottom:3%;min-height:24cqw;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.face{padding-left:20.5cqw}
.msg .facebox{position:absolute;left:2cqw;top:2.2cqw;width:15.5cqw;aspect-ratio:64/56;border:.4cqw solid var(--edge);border-radius:.8cqw;background:linear-gradient(180deg,#4a3a9a,#1c1650);overflow:hidden;box-shadow:inset 0 0 0 .3cqw rgba(0,0,0,.4)}
.msg .facebox canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.msg .tag{position:absolute;top:-1.25em;left:2cqw;padding:.05em .8em;font-size:.86em;background:linear-gradient(180deg,#4a2f8a,#1c1452);border:.4cqw solid var(--edge);border-radius:.8cqw;color:var(--gold);box-shadow:0 0 0 .3cqw var(--edge-dark)}
.msg .arrow,.narr .arrow{position:absolute;right:2.4cqw;bottom:.6cqw;color:var(--gold);animation:bob .7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(.6cqw)}}
.menu{min-width:22%}
.menu .item{position:relative;padding-left:1.3em;white-space:nowrap;display:flex;justify-content:space-between;gap:1.2em;cursor:pointer}
.menu .item.sel::before{content:"▶";position:absolute;left:0;color:var(--gold);animation:nudge .6s steps(2) infinite}
@keyframes nudge{50%{transform:translateX(.5cqw)}}
.menu .item.dis{color:var(--muted)}
.menu .item .rt{font-variant-numeric:tabular-nums}
.ttl{position:absolute;top:-.95em;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#4a2f8a,#1c1452);border:.35cqw solid var(--edge);border-radius:.7cqw;padding:0 .6em;font-size:.8em;white-space:nowrap;color:var(--gold)}
.party{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.1em 1.4em;font-size:.84em;line-height:1.25;font-variant-numeric:tabular-nums}
.pc{min-width:0}
.pc .nm{white-space:nowrap;overflow:hidden;display:flex;justify-content:space-between;gap:.3em}
.pc .lv{color:var(--muted);font-size:.85em}
.pc .bar{height:.75cqw;background:#05051a;border:.2cqw solid #000;margin:.15em 0 .25em;position:relative;overflow:hidden}
.pc .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#a8ffb0,var(--hp));transition:width .35s}
.pc .bar.lowb i{background:linear-gradient(180deg,#ffc0a0,var(--danger))}
.pc.act .nm .n{color:var(--gold)}
.pc.low .hpv{color:var(--danger)}
.pc.ko{opacity:.5}
.pc.hit{animation:hit .4s}
.pc.heal{animation:heal .7s}
@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-.9cqw);color:#ff6a5a}40%{transform:translateX(.9cqw);color:#ff6a5a}60%{transform:translateX(-.5cqw)}80%{transform:translateX(.4cqw)}}
@keyframes heal{40%{color:#b8ffc4;text-shadow:0 0 1.4cqw #6eff8a,0 0 .4cqw #6eff8a}}
.gold{font-variant-numeric:tabular-nums;color:var(--gold)}
.np{right:3%;top:3%;font-size:.78em;padding:.6cqw 2cqw;color:#ffe0f4;background:linear-gradient(90deg,#4a1a6a,#1a0a3a);border-color:#ff7fd0;transition:opacity .8s,transform .8s}
.np b{color:#7ff0ff;font-weight:normal}
.mapname{left:50%;top:5%;transform:translateX(-50%);padding:.7cqw 7cqw;border:none;border-radius:0;box-shadow:none;background:linear-gradient(90deg,transparent,rgba(8,6,36,.88) 22%,rgba(8,6,36,.88) 78%,transparent);letter-spacing:.2em;color:var(--gold);white-space:nowrap;transition:opacity .7s}
.mapname::before,.mapname::after{content:"";position:absolute;left:12%;right:12%;height:.3cqw;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.mapname::before{top:0}.mapname::after{bottom:0}
.narr{inset:0;border:none;background:transparent;box-shadow:none;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;font-size:1.1em;line-height:1.9;padding:6cqw}
.narr.low{align-items:flex-end;padding:0 4cqw 4.5cqw}
.narr.low>div:first-child{background:rgba(6,4,22,.8);border:.35cqw solid rgba(239,234,255,.55);border-radius:1cqw;padding:1.4cqw 3.4cqw;box-shadow:0 0 0 .35cqw rgba(0,0,0,.5)}
.titlebox{position:absolute;left:0;right:0;top:7%;text-align:center;pointer-events:none}
.titlebox .sub{font-size:4.2cqw;color:var(--gold);letter-spacing:.35em;text-shadow:0 .4cqw 0 #5a2a10}
.titlebox .main{font-size:10.5cqw;line-height:1.15;color:#fff6ff;letter-spacing:.05em;text-shadow:0 .5cqw 0 #c0307a,0 1cqw 0 #5a1040,.4cqw 1.5cqw 0 #12061e;animation:float 3.2s ease-in-out infinite}
.titlebox .main b{font-weight:normal;color:#ffe2f0;text-shadow:0 .5cqw 0 #ff4f9e,0 1cqw 0 #8a1050,.4cqw 1.5cqw 0 #12061e}
.titlebox .cr{font-size:2.5cqw;color:var(--muted);margin-top:1.4cqw;letter-spacing:.3em}
@keyframes float{50%{transform:translateY(-.8cqw)}}
.stats{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;line-height:1.9;min-width:62%}
.stats .big{font-size:2.1em;color:var(--gold);letter-spacing:.25em}
#pad{width:100%;max-width:768px;display:flex;align-items:center;justify-content:space-between;gap:16px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.pb{font-family:var(--font-game);font-size:20px;color:var(--edge);background:linear-gradient(180deg,#2a2648,#16132c);border:2px solid #3e3866;border-radius:10px;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0;box-shadow:0 3px 0 #06050f}
.pb:active,.pb.on{background:#3a3462;border-color:var(--gold);transform:translateY(2px);box-shadow:0 1px 0 #06050f}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.ab{display:flex;gap:14px;align-items:center}
.ab .pb{width:68px;height:68px;border-radius:50%;font-size:22px}
.ab .a{background:linear-gradient(180deg,#7a2a4a,#4a1430);border-color:#c04a7a;margin-bottom:28px}
.ab .b{background:linear-gradient(180deg,#2a3a7a,#141c4a);border-color:#4a6ac0}
.hint{flex:1;min-width:0;text-align:center;font-size:12px;line-height:1.7;color:var(--muted)}
@media (max-width:420px){.hint{display:none}.dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}.ab .pb{width:60px;height:60px}}
@media (prefers-reduced-motion:reduce){.msg .arrow,.narr .arrow,.menu .item.sel::before,.titlebox .main{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <canvas id="cv" width="480" height="352"></canvas>
    <div id="layer"></div>
  </div>
  <div id="pad">
    <div class="dpad">
      <button class="pb u" data-k="up" tabindex="-1" aria-label="上">▲</button>
      <button class="pb l" data-k="left" tabindex="-1" aria-label="左">◀</button>
      <button class="pb r" data-k="right" tabindex="-1" aria-label="右">▶</button>
      <button class="pb d" data-k="down" tabindex="-1" aria-label="下">▼</button>
    </div>
    <div class="hint">移動：矢印キー / WASD<br>しらべる・決定：Z / Enter<br>メニュー・もどる：X / Esc</div>
    <div class="ab">
      <button class="pb b" data-k="cancel" tabindex="-1" aria-label="Bボタン（メニュー・もどる）">B</button>
      <button class="pb a" data-k="ok" tabindex="-1" aria-label="Aボタン（しらべる・決定）">A</button>
    </div>
  </div>
</div>
<script>
'use strict';
// =====================================================================
//  怪盗館長と幻のサンダル  (16-bit edition)
// =====================================================================
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-t,3);
const TILE=32,VW=15,VH=11,CW=480,CH=352;
const cv=$('#cv'),ctx=cv.getContext('2d');
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const FONT='"DotGothic16","MS Gothic",monospace';
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function hsh(a,b,c){let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263)+Math.imul(c|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
const shade=(c,f)=>mix(mix(c,'#000000',1-f),'#2a1450',.12);
const tint=(c,f)=>mix(c,'#fff6dc',f);

// ---------------------------------------------------------------- audio
let AC=null,soundOn=true,noiseBuf=null;
function ac(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*0.5;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type='square',vol=.05,when=0,f2){const a=ac();if(!a)return;const t=a.currentTime+when;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol=.08,when=0,hp){const a=ac();if(!a||!noiseBuf)return;const t=a.currentTime+when;const s=a.createBufferSource(),g=a.createGain();s.buffer=noiseBuf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);let n=s;if(hp){const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;s.connect(f);n=f}n.connect(g).connect(a.destination);s.start(t);s.stop(t+dur)}
function sfx(k){if(!soundOn)return;try{switch(k){
  case'blip':tone(760,.03,'square',.016);break;
  case'cursor':tone(660,.04,'square',.03);break;
  case'ok':tone(990,.06,'square',.035);break;
  case'cancel':tone(440,.06,'square',.03);break;
  case'slash':noise(.12,.12,0,2500);tone(1400,.08,'sawtooth',.02,0,500);break;
  case'hit':noise(.12,.14);tone(220,.08,'square',.03);break;
  case'crit':noise(.25,.2);tone(1800,.2,'square',.04,0,300);break;
  case'hurt':tone(160,.18,'sawtooth',.05,0,60);noise(.12,.08);break;
  case'heal':[523,659,784,1046].forEach((f,i)=>tone(f,.12,'triangle',.05,i*.06));break;
  case'magic':tone(300,.5,'sawtooth',.03,0,1600);[1046,1318,1568].forEach((f,i)=>tone(f,.15,'triangle',.04,.25+i*.06));break;
  case'lvl':[523,659,784,659,784,1046].forEach((f,i)=>tone(f,.14,'square',.035,i*.09));break;
  case'enc':[880,660,880,660,880,440,330].forEach((f,i)=>tone(f,.05,'square',.03,i*.04));break;
  case'win':[523,523,523,698,880,784,1046].forEach((f,i)=>tone(f,.16,'square',.035,i*.11));break;
  case'boom':noise(.9,.2);tone(80,.9,'sawtooth',.06,0,30);break;
  case'item':[784,988,1175,1568].forEach((f,i)=>tone(f,.1,'square',.03,i*.07));break;
  case'door':tone(300,.1,'square',.03,0,180);break;
  case'gulp':tone(300,.45,'sine',.14,0,50);break;
  case'emo':tone(1200,.05,'square',.03);tone(1600,.07,'square',.03,.06);break;
  case'whoosh':noise(.35,.09,0,1200);break;
  case'die':tone(600,.35,'square',.03,0,80);noise(.3,.05,0,3000);break;
  case'step':noise(.03,.015,0,800);break;
}}catch(e){}}

// ---------------------------------------------------------------- ruins club BGM (beat-synced)
const BGM_URL='ruins-bgm.mp3',BPM=91,BEAT0=.345,SPB=60/BPM;
const BGM={buf:null,el:null,src:null,an:null,gain:null,lp:null,loading:false,playing:false,offset:0,startedAt:0,want:'off',tv:-1,tf:-1,freq:null,level:0,bass:0,elVol:0,offT:0,shown:false};
function bgmGraph(){const a=ac();if(!a)return null;if(!BGM.gain){BGM.lp=a.createBiquadFilter();BGM.lp.type='lowpass';BGM.lp.frequency.value=20000;BGM.an=a.createAnalyser();BGM.an.fftSize=512;BGM.an.smoothingTimeConstant=.55;BGM.gain=a.createGain();BGM.gain.gain.value=0;BGM.lp.connect(BGM.an);BGM.an.connect(BGM.gain);BGM.gain.connect(a.destination);BGM.freq=new Uint8Array(BGM.an.frequencyBinCount)}return a}
async function bgmLoad(){if(BGM.loading)return;BGM.loading=true;const a=bgmGraph();if(!a){BGM.loading=false;return}
  try{if(location.protocol==='file:')throw new Error('local file');const r=await fetch(BGM_URL);if(!r.ok)throw new Error('fetch');BGM.buf=await a.decodeAudioData(await r.arrayBuffer())}
  catch(e){try{const el=new Audio(BGM_URL);el.loop=true;el.preload='auto';el.volume=0;BGM.el=el}catch(_){}}}
function bgmPos(){if(BGM.src&&AC)return(AC.currentTime-BGM.startedAt)%BGM.buf.duration;if(BGM.el)return BGM.el.currentTime;return BGM.offset}
function bgmStart(){if(BGM.playing||!AC)return;
  if(BGM.buf){const s=AC.createBufferSource();s.buffer=BGM.buf;s.loop=true;s.connect(BGM.lp);const off=BGM.offset%BGM.buf.duration;s.start(0,off);BGM.src=s;BGM.startedAt=AC.currentTime-off}
  else if(BGM.el){const pr=BGM.el.play();if(pr&&pr.catch)pr.catch(()=>{})}else return;
  BGM.playing=true;if(BGM.want==='on'&&!BGM.shown){BGM.shown=true;nowPlaying()}}
function bgmStopNow(){if(BGM.src){BGM.offset=bgmPos();try{BGM.src.stop()}catch(e){}BGM.src=null}if(BGM.el)BGM.el.pause();BGM.playing=false;BGM.shown=false}
function updateBgm(dt){
  let want='off';if(S&&(mode==='field'||mode==='battle')){if(S.map==='ruins')want='on';else if(S.map==='pink')want='muffled'}
  BGM.want=want;if(want!=='off'&&AC&&!BGM.loading)bgmLoad();
  if(want!=='off'&&!BGM.playing&&(BGM.buf||BGM.el))bgmStart();
  const vol=(!soundOn||want==='off')?0:(want==='muffled'?.3:.42),fq=want==='muffled'?650:20000;
  if(BGM.gain&&AC){if(BGM.tv!==vol){BGM.tv=vol;BGM.gain.gain.setTargetAtTime(vol,AC.currentTime,.25)}if(BGM.tf!==fq){BGM.tf=fq;BGM.lp.frequency.setTargetAtTime(fq,AC.currentTime,.3)}}
  if(BGM.el&&!BGM.src){BGM.elVol+=((want==='muffled'?vol*.6:vol)-BGM.elVol)*Math.min(1,dt/300);BGM.el.volume=clamp(BGM.elVol,0,1)}
  if(want==='off'&&BGM.playing){BGM.offT+=dt;if(BGM.offT>1200){bgmStopNow();BGM.offT=0}}else BGM.offT=0;
  if(BGM.playing&&BGM.src&&BGM.an){BGM.an.getByteFrequencyData(BGM.freq);let b=0,l=0;for(let i=1;i<6;i++)b+=BGM.freq[i];for(let i=0;i<BGM.freq.length;i++)l+=BGM.freq[i];BGM.bass=b/(5*255);BGM.level=l/(BGM.freq.length*255)*2.2}
  else if(BGM.playing){BGM.bass=.7;BGM.level=.55}else{BGM.bass=0;BGM.level=0}
}
function beatInfo(){if(!BGM.playing||BGM.want==='off')return{ph:0,pulse:0,n:0,on:false};const b=(bgmPos()-BEAT0)/SPB+64,n=Math.floor(b),ph=b-n;return{ph,pulse:Math.pow(1-ph,3)*(.45+BGM.bass*.8),n,on:true}}
function nowPlaying(){const w=el('div','win np');w.innerHTML='♪ NOW PLAYING　<b>Flip it n zip</b>';setTimeout(()=>{w.style.opacity='0';w.style.transform='translateY(-1cqw)'},3200);setTimeout(()=>w.remove(),4200)}

// ---------------------------------------------------------------- pixel sprites
// Uppercase letters are base colors; lowercase are auto-derived shadows; I/D/T are auto highlights.
const LIGHT={I:'H',D:'C',T:'S',J:'K'};
function resolvePal(pal){const out=Object.assign({},pal);
  Object.keys(pal).forEach(k=>{const lo=k.toLowerCase();if(lo!==k&&!(lo in out))out[lo]=shade(pal[k],.7)});
  Object.keys(LIGHT).forEach(L=>{if(!(L in out)&&pal[LIGHT[L]])out[L]=tint(pal[LIGHT[L]],.35)});return out}
function paint(rows,pal){const P=resolvePal(pal);const h=rows.length,w=rows[0].length;const px=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x];px.push(ch!=='.'&&P[ch]?P[ch]:null)}return{w,h,px,rows}}
function autoShade(img){const{w,h,px,rows}=img;const out=px.slice();const edge=(x,y)=>x<0||y<0||x>=w||y>=h||!px[y*w+x]||rows[y][x]==='O';
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(!px[i]||rows[y][x]==='O')continue;let c=px[i];
    if(edge(x-1,y)||edge(x,y-1))c=tint(c,.28);else if(edge(x+1,y)||edge(x,y+1))c=shade(c,.7);else if(y>h*.62&&((x+y)&1))c=shade(c,.88);out[i]=c}
  img.px=out;return img}
function addOutline(img){const{w,h,px}=img;const out=px.slice();
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(px[i])continue;
    for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const n=px[ny*w+nx];if(n){out[i]=mix(shade(n,.3),'#0a0616',.5);break}}}
  img.px=out;return img}
function toCanvas(img){const c=mk(img.w,img.h);const g=c.getContext('2d');img.px.forEach((col,i)=>{if(col){g.fillStyle=col;g.fillRect(i%img.w,Math.floor(i/img.w),1,1)}});return c}
function whiteOf(c){const w=mk(c.width,c.height);const g=w.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);return w}

function typeText(node,prefix,text,speed){
  return new Promise(res=>{let i=0;node.textContent=prefix;if(!text.length){res();return}
    const iv=setInterval(()=>{i++;node.textContent=prefix+text.slice(0,i);if(i%3===1)sfx('blip');if(i>=text.length){clearInterval(iv);typing=null;res()}},speed);
    typing={finish(){clearInterval(iv);node.textContent=prefix+text;typing=null;res()}};
  });
}
async function pages(win,node,arrow,list,speed,speakers){
  for(const raw of list){
    let p=raw;
    if(speakers){const sp=parseSpeaker(raw);setSpeaker(sp);if(sp)p=sp.body}
    win.hidden=false;arrow.hidden=true;
    await new Promise(res=>{let done=false;
      const h={tap:true,onKey(k){if(k!=='ok'&&k!=='cancel')return;if(typing){typing.finish();return}if(done){popH(h);res()}}};
      pushH(h);typeText(node,'',p,speed).then(()=>{done=true;arrow.hidden=false});
    });
  }
  win.hidden=true;
}

async function blog(text,wait=420){
  setSpeaker(null);msgWin.hidden=false;msgArrow.hidden=true;
  logLines.push(text);while(logLines.length>3)logLines.shift();
  const prefix=logLines.slice(0,-1).map(s=>s+'\n').join('');
  let skip=null;const h={tap:true,onKey(k){if(k!=='ok'&&k!=='cancel')return;if(typing)typing.finish();else if(skip)skip()}};
  pushH(h);await typeText(msgText,prefix,text,16);
  await new Promise(res=>{const t=setTimeout(res,wait);skip=()=>{clearTimeout(t);res()}});
  popH(h);
}

function choose(opts,o={}){
  return new Promise(res=>{
    const w=el('div','win menu');Object.assign(w.style,o.style||{left:'3%',top:'3%'});
    if(o.title){el('div','ttl',w).textContent=o.title}
    const norm=opts.map(x=>typeof x==='string'?{label:x}:x);
    let i=Math.max(0,Math.min(o.start||0,norm.length-1));
    const items=norm.map((x,idx)=>{const d=el('div','item'+(x.disabled?' dis':''),w);el('span','',d).textContent=x.label;if(x.right!=null)el('span','rt',d).textContent=x.right;
      d.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();if(i!==idx){i=idx;draw();o.onMove&&o.onMove(i)}else h.onKey('ok')});return d});
    const draw=()=>items.forEach((d,idx)=>d.classList.toggle('sel',idx===i));draw();o.onMove&&o.onMove(i);
    const close=()=>{popH(h);w.remove()};
    const h={onKey(k){const n=norm.length;
      if(k==='up'){i=(i-1+n)%n;sfx('cursor');draw();o.onMove&&o.onMove(i)}
      else if(k==='down'){i=(i+1)%n;sfx('cursor');draw();o.onMove&&o.onMove(i)}
      else if(k==='ok'){if(norm[i].disabled){sfx('cancel');return}sfx('ok');close();res(i)}
      else if(k==='cancel'&&o.cancel!==false){sfx('cancel');close();res(-1)}}};
    pushH(h);
  });
}
function waitKey(){return new Promise(res=>{const h={tap:true,onKey(k){if(k==='ok'||k==='cancel'){popH(h);res()}}};pushH(h)})}
function waitKeyShort(ms=1600){msgArrow.hidden=false;return new Promise(res=>{let t=0;const done=()=>{clearTimeout(t);popH(h);res()};const h={tap:true,onKey(k){if(k==='ok'||k==='cancel')done()}};t=setTimeout(done,ms);pushH(h)})}

// ---------------------------------------------------------------- effects helpers
function anim(ms,fn){return new Promise(res=>{const t0=performance.now();const step=now=>{const t=Math.min(1,(now-t0)/ms);fn(t);if(t<1)requestAnimationFrame(step);else res()};requestAnimationFrame(step)})}
function fadeTo(v,ms=400){const s=fade;return anim(ms,t=>{fade=s+(v-s)*t})}
function flash(a=1,c='255,255,255'){flashC=c;flashA=REDUCED?Math.min(a,.3):a}
function shake(ms=250){if(!REDUCED)shakeUntil=performance.now()+ms}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// ---------------------------------------------------------------- particles (PW world space, PS screen space)
let PW=[],PS=[];
function addP(list,o){list.push(Object.assign({t0:performance.now(),life:1000,vx:0,vy:0,size:2},o))}
function burst(list,x,y,n,o){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(o.speed||.15)*(.4+Math.random());addP(list,Object.assign({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||0)},o))}}
function updParticles(list,dt,now){for(let i=list.length-1;i>=0;i--){const p=list[i];const age=now-p.t0;if(age>p.life){list.splice(i,1);continue}
  if(p.type==='firefly'){p.vx+=(Math.random()-.5)*.004*dt;p.vy+=(Math.random()-.5)*.004*dt;p.vx=clamp(p.vx,-.03,.03);p.vy=clamp(p.vy,-.03,.03)}
  if(p.type==='petal')p.vx=.02+Math.sin(age*.003+p.x)*.03;
  if(p.g)p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}}
function drawParticles(g,list,ox,oy,now){
  for(const p of list){const age=now-p.t0,t=age/p.life,x=Math.round(p.x-ox),y=Math.round(p.y-oy);const fadeA=t<.15?t/.15:t>.7?(1-t)/.3:1;g.globalAlpha=clamp(fadeA,0,1)*(p.a||1);
    switch(p.type){
    case'firefly':{const b=.5+.5*Math.sin(age*.006+p.x);g.fillStyle='rgba(220,255,120,'+(.25*b)+')';g.fillRect(x-3,y-3,6,6);g.fillStyle='#eaffa0';g.fillRect(x-1,y-1,2,2);break}
    case'mote':g.fillStyle=p.c||'#9af0ff';g.fillRect(x,y,2,2);break;
    case'heart':g.fillStyle='#ff7ab6';g.fillRect(x-2,y,2,2);g.fillRect(x+1,y,2,2);g.fillRect(x-2,y+2,5,2);g.fillRect(x-1,y+4,3,1);g.fillRect(x,y+5,1,1);break;
    case'petal':g.fillStyle=p.c||'#ffb0d0';g.fillRect(x,y,3,2);g.fillStyle='#fff';g.fillRect(x,y,1,1);break;
    case'bubble':g.strokeStyle='#c8ff8a';g.lineWidth=1;g.strokeRect(x-2,y-2,4,4);break;
    case'dust':{const s=2+t*6;g.fillStyle='rgba(230,220,200,.6)';g.fillRect(x-s/2,y-s/2,s,s);break}
    case'spark':g.fillStyle=p.c||'#fff6c0';g.fillRect(x-1,y-1,p.size,p.size);break;
    case'star':{g.fillStyle=p.c||'#fff6c0';const s=t<.5?2:1;g.fillRect(x-s*2,y,s*4+1,1);g.fillRect(x,y-s*2,1,s*4+1);break}
    case'confetti':g.fillStyle=p.c;g.fillRect(x,y,4,3);break;
    case'rock':g.fillStyle=p.c||'#4a3a2a';g.fillRect(x,y,p.size,p.size);break;
    case'txt':g.font='20px '+FONT;g.fillStyle=p.c||'#fff';g.strokeStyle='#000';g.lineWidth=4;g.strokeText(p.text,x,y);g.fillText(p.text,x,y);break;
    }}
  g.globalAlpha=1;
}

// ---------------------------------------------------------------- followers & emotes
let followers=[];
function resetFollowers(){if(!S){followers=[];return}followers=S.party.slice(1).map(p=>({key:p.id,x:S.x,y:S.y,fx:S.x,fy:S.y,dir:S.dir,moved:false}))}
function moveFollowers(fromX,fromY){let tx=fromX,ty=fromY;for(const f of followers){const ox=f.x,oy=f.y;f.fx=ox;f.fy=oy;f.moved=(ox!==tx||oy!==ty);if(f.moved)f.dir=tx>ox?'right':tx<ox?'left':ty>oy?'down':'up';f.x=tx;f.y=ty;tx=ox;ty=oy}}
let emotes=[];
function emote(who,kind,dur=1100){if(mode!=='field'&&mode!=='scene')return wait(200);emotes.push({who,kind,t0:performance.now(),dur});sfx(kind==='sweat'||kind==='…'?'blip':'emo');return wait(Math.min(dur,650))}
function emoteAll(kind){emote('kaito',kind);followers.forEach(f=>emote(f.key,kind));return wait(650)}
function actorWorld(who){
  const t=mv?mv.t:1;
  if(who==='kaito'||who==='player')return[(mv?mv.fx+(mv.tx-mv.fx)*t:S.x)*TILE,(mv?mv.fy+(mv.ty-mv.fy)*t:S.y)*TILE];
  const f=followers.find(f=>f.key===who);if(f)return[(f.fx+(f.x-f.fx)*t)*TILE,(f.fy+(f.y-f.fy)*t)*TILE];
  if(typeof who==='object')return[who.x*TILE,who.y*TILE];
  const e=MAPS[S.map].events.find(e=>e.id===who);if(e)return[e.x*TILE,e.y*TILE];
  return null;
}
function drawEmotes(g,now){
  emotes=emotes.filter(e=>now-e.t0<e.dur);
  for(const e of emotes){const w=actorWorld(e.who);if(!w)continue;const age=now-e.t0;
    const s=age<120?ease(age/120)*1.15:age<200?1.15-(age-120)/80*.15:1;const img=emoSprite(e.kind);
    const sw=img.width*2*s,sh=img.height*2*s;let x=w[0]-CAM.x+16-sw/2,y=w[1]-CAM.y-22-sh+Math.sin(age*.01)*1.5;
    if(e.kind==='anger'){x+=12;y+=8}if(e.kind==='sweat'){x+=14;y+=14+age*.01}
    g.save();g.imageSmoothingEnabled=false;g.drawImage(img,Math.round(x),Math.round(y),sw,sh);g.restore()}
}

const MZ=(()=>{
  const N=12,W=N*2+1;const g=Array.from({length:W},()=>Array(W).fill('M'));
  let seed=20261003;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
  const vis=Array.from({length:N},()=>Array(N).fill(false));const st=[[0,0]];vis[0][0]=true;g[1][1]='m';
  while(st.length){const[cx,cy]=st[st.length-1];
    const nb=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>{const nx=cx+dx,ny=cy+dy;return nx>=0&&ny>=0&&nx<N&&ny<N&&!vis[ny][nx]});
    if(!nb.length){st.pop();continue}
    const[dx,dy]=nb[Math.floor(rnd()*nb.length)];const nx=cx+dx,ny=cy+dy;vis[ny][nx]=true;g[cy*2+1+dy][cx*2+1+dx]='m';g[ny*2+1][nx*2+1]='m';st.push([nx,ny])}
  let k=0,guard=0;while(k<8&&guard++<5000){const x=1+Math.floor(rnd()*(W-2)),y=1+Math.floor(rnd()*(W-2));if(g[y][x]!=='M')continue;
    if((x%2===0&&y%2===1&&g[y][x-1]==='m'&&g[y][x+1]==='m')||(x%2===1&&y%2===0&&g[y-1][x]==='m'&&g[y+1][x]==='m')){g[y][x]='m';k++}}
  const bfs=(sx,sy)=>{const d=Array.from({length:W},()=>Array(W).fill(-1));d[sy][sx]=0;const q=[[sx,sy]];while(q.length){const[x,y]=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(g[ny]&&g[ny][nx]==='m'&&d[ny][nx]<0){d[ny][nx]=d[y][x]+1;q.push([nx,ny])}}}return d};
  const ds=bfs(1,1),de=bfs(W-2,W-2);
  const nbrs=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>g[y+dy][x+dx]==='m').map(([dx,dy])=>[x+dx,y+dy]);
  let dead=[];for(let y=1;y<W;y+=2)for(let x=1;x<W;x+=2)if(nbrs(x,y).length===1&&!(x===1&&y===1)&&!(x===W-2&&y===W-2))dead.push([x,y]);
  const take=f=>{dead.sort(f);return dead.shift()};
  const are=take((a,b)=>ds[b[1]][b[0]]-ds[a[1]][a[0]]);
  const sandal=take((a,b)=>de[a[1]][a[0]]-de[b[1]][b[0]]);
  const bed=take((a,b)=>ds[a[1]][a[0]]-ds[b[1]][b[0]]);const bedFront=nbrs(bed[0],bed[1])[0];
  const shopP=take((a,b)=>ds[a[1]][a[0]]-ds[b[1]][b[0]]);
  const keibuP=dead.length?take((a,b)=>ds[a[1]][a[0]]-ds[b[1]][b[0]]):null;
  const chests=[];while(dead.length&&chests.length<3)chests.push(dead.splice(Math.floor(rnd()*dead.length),1)[0]);
  const reserved=new Set([are,sandal,bed,shopP,keibuP,...chests].filter(Boolean).map(p=>p.join(',')));
  for(let y=1;y<W-1;y++)for(let x=1;x<W-1;x++){if(g[y][x]==='m'&&ds[y][x]>5&&de[y][x]>2&&!reserved.has(x+','+y)&&rnd()<.06)g[y][x]='a'}
  g[bed[1]][bed[0]]='b';g[W-2][W-2]='E';
  return{rows:g.map(r=>r.join('')),are,sandal,bed,bedFront,shop:shopP,keibu:keibuP,chests,exit:[W-2,W-2]};
})();

// ---------------------------------------------------------------- field logic
const visEvents=m=>m.events.filter(e=>!e.show||e.show());
function eventAt(x,y){return visEvents(MAPS[S.map]).find(e=>e.x===x&&e.y===y)}
function tileAtM(m,x,y){if(x<0||y<0||x>=m.w||y>=m.h)return m.outside;return m.tiles[y][x]}
function tileAt(x,y){return tileAtM(MAPS[S.map],x,y)}
function tryMove(dir){
  S.dir=dir;const[dx,dy]=DIRV[dir];const nx=S.x+dx,ny=S.y+dy;
  const ev=eventAt(nx,ny);if(ev&&ev.solid!==false)return;
  if(!PASS.has(tileAt(nx,ny)))return;
  moveFollowers(S.x,S.y);
  mv={fx:S.x,fy:S.y,tx:nx,ty:ny,t:0};stepN++;
}
function finishStep(){
  S.x=mv.tx;S.y=mv.ty;mv=null;followers.forEach(f=>{f.fx=f.x;f.fy=f.y});
  const m=MAPS[S.map];const t=m.tiles[S.y][S.x];
  if(',_R.m'.includes(t)&&Math.random()<.5){addP(PW,{type:'dust',x:S.x*TILE+16,y:S.y*TILE+28,life:380,vy:-.01});sfx('step')}
  const w=m.warps.find(w=>w.x===S.x&&w.y===S.y);
  if(w){sfx('door');runScript(()=>warpTo(...w.to));return}
  const ev=visEvents(m).find(e=>e.x===S.x&&e.y===S.y&&e.touch);
  if(ev){runScript(ev.touch);return}
  if(t==='a'){S.party.forEach(p=>{if(p.hp>1)p.hp-=1});flash(.3,'120,255,60');sfx('hurt')}
  if(m.enc){const grp=m.enc(S.x,S.y);if(grp){encSteps--;if(encSteps<=0){encSteps=rand(14,26);runScript(async()=>{await emote('kaito','!',600);await battle(pick(grp))})}}}
}
async function warpTo(map,x,y,dir){
  await fadeTo(1,260);S.map=map;S.x=x;S.y=y;if(dir)S.dir=dir;mv=null;encSteps=rand(12,24);PW=[];emotes=[];resetFollowers();
  await fadeTo(0,260);const m=MAPS[map];showMapName(m.name);if(m.onEnter)await m.onEnter();
}
async function interact(){
  const[dx,dy]=DIRV[S.dir];const tx=S.x+dx,ty=S.y+dy;
  let ev=eventAt(tx,ty);
  if(!ev&&tileAt(tx,ty)==='c')ev=eventAt(tx+dx,ty+dy);
  if(ev&&ev.talk){if(ev.dir&&!ev.obj)ev.dir={up:'down',down:'up',left:'right',right:'left'}[S.dir];await ev.talk();return}
  const t=tileAt(tx,ty);
  if(t==='b')return rest('ベッドで やすみますか？',{map:S.map,x:S.x,y:S.y});
  if(t==='L')return rest('光の泉だ。 からだを ひたしますか？',{map:S.map,x:S.x,y:S.y});
}

  const ridge=(col,base,amp,f1,f2,seed)=>{for(let x=0;x<240;x++){const y=base-Math.abs(Math.sin(x*f1+seed))*amp-Math.sin(x*f2+seed*2)*amp*.4;R(col,x,Math.round(y),1,176)}};
  if(kind==='field'){
    bands(['#08081e','#0e0e2c','#15143c','#1e1a4a','#2a2058','#3a2a64','#4e3470'],0,96);

    for(let y=-12;y<=12;y++)for(let x=-12;x<=12;x++){if(x*x+y*y<=121)R(x+y<-6?'#fffbe0':'#f4e6b0',186+x,26+y)}R('#e0d090',182,22,3,2);R('#e0d090',190,30,2,2);

// ---------------------------------------------------------------- battle: core
let bStat=null;
function updateBattleStatus(){if(bStat)fillParty(bStat,B?B.active:-1)}
const liveEnemies=()=>B?B.ens.filter(e=>e.hp>0):[];
function liveTarget(t){if(t&&t.hp>0)return t;const l=liveEnemies();return l.length?pick(l):null}
function physDmg(atk,def,mult){return Math.max(1,Math.round((atk*mult-def/2)*(.85+Math.random()*.3)))}
function layoutEnemies(){
  const ens=B.ens;const ws=ens.map(e=>e.w);const total=ws.reduce((s,v)=>s+v,0)+(ens.length-1)*20;let x=(CW-total)/2;
  ens.forEach(e=>{e.x=x;e.base=222;e.top=e.base-e.h;e.cx=x+e.w/2;e.cy=e.base-e.h*.5;x+=e.w+20});
}
function pop(e,text,c){B.pops.push({x:e.cx,y:e.top+12,text:String(text),c:c||'#ffffff',t0:performance.now()})}
async function dmgEnemy(e,d){
  if(e.hp<=0)return;e.hp-=d;e.hurtT=performance.now();sfx('hit');pop(e,d);
  burst(PS,e.cx,e.cy,6,{type:'spark',life:300,speed:.3,c:'#fff6c0',size:3});
  await blog(e.name+'に '+d+'の ダメージ！');

    if(B.o.undying===e.d.key){e.hp=Math.round(e.mhp*.4);e.hurtT=performance.now();flash(.4,'200,120,255');await blog(e.name+'は 弟への 想いで 立ちあがった！');await blog('（このままでは キリがない…… なにか 別の 方法は……？）');return}
    e.hp=0;e.dieT=performance.now();sfx('die');await blog(e.name+'を たおした！');
  }
}
async function hitEnemy(p,t,mult,canCrit,fxk='slash'){
  t=liveTarget(t);if(!t)return;
  if(canCrit&&Math.random()<1/16){await blog('かいしんの いちげき！！');sfx('crit');await playFx('xslash',t);flash(.6);shake(300);return dmgEnemy(t,Math.round(p.atk*1.5*(.9+Math.random()*.2)))}
  if(fxk)await playFx(fxk,t);
  return dmgEnemy(t,physDmg(p.atk,t.def,mult));
}
function chooseTarget(){const al=living();const tn=al.filter(p=>p.taunt);if(tn.length&&Math.random()<.8)return tn[0];return pick(al)}
async function hitMember(e,p,mult,noRetarget){
  if(p.hp<=0){if(noRetarget)return;p=chooseTarget();if(!p)return}
  let d=physDmg(e.atk,p.def,mult);if(p.guard)d=Math.ceil(d/2);
  p.hp=Math.max(0,p.hp-d);shake(260);sfx('hurt');flash(.22,'255,40,40');cellFlash(p,'hit');updateBattleStatus();
  await blog(p.name+'は '+d+'の ダメージを うけた！');
  if(p.hp<=0)await blog(p.name+'は たおれた……');
}

function ring(g,x,y,r,c,w,ry){g.save();g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.ellipse(x,y,r,ry||r,0,0,Math.PI*2);g.stroke();g.restore()}

async function pickSkill(p){
  const i=await choose(p.skills.map(s=>({label:SKILLS[s].name,right:SKILLS[s].mp+'MP',disabled:p.mp<SKILLS[s].mp})),{style:SUB,title:'とくぎ'});if(i<0)return null;

    const p=alive[i];B.active=S.party.indexOf(p);updateBattleStatus();
    if(p.bind>0){acts[i]={type:'bound',actor:p};i++;continue}
    const c=await choose(['たたかう','とくぎ','どうぐ','ぼうぎょ','にげる'],{style:CMD,title:p.name});
    if(c<0){if(i>0)i--;continue}
    let a=null;
    if(c===0){const t=await pickEnemy();if(t)a={type:'atk',actor:p,target:t}}
    else if(c===1)a=await pickSkill(p);
    else if(c===2)a=await pickItem(p);
    else if(c===3)a={type:'guard',actor:p};
    else{B.active=-1;updateBattleStatus();return{run:true}}
    if(a){acts[i]=a;i++}
  }
  B.active=-1;updateBattleStatus();return{acts:acts.slice(0,alive.length)};
}
async function partyAct(a){
  const p=a.actor;
  switch(a.type){
   case'atk':await blog(p.name+'の こうげき！');return hitEnemy(p,a.target,1,true);
   case'guard':return blog(p.name+'は みを まもっている。');
   case'bound':p.bind=0;return blog(p.name+'は '+(p.bindMsg||'うごけない！'));
   case'skill':{const s=SKILLS[a.skill];if(p.mp<s.mp){await blog(p.name+'は '+s.name+'を つかおうとした！');return blog('しかし MPが たりない！')}
     p.mp-=s.mp;updateBattleStatus();
     if(s.tg==='ally'&&a.target.hp<=0){await blog(p.name+'の '+s.name+'！');return blog('しかし '+a.target.name+'は たおれている……')}
     return s.run(p,a.target)}
   case'item':return useItem(a.item,p,a.target,true);
  }
}

const SPIRAL=(()=>{const W=15,Hh=11,o=[];let x0=0,y0=0,x1=W-1,y1=Hh-1;while(x0<=x1&&y0<=y1){for(let x=x0;x<=x1;x++)o.push([x,y0]);y0++;for(let y=y0;y<=y1;y++)o.push([x1,y]);x1--;if(y0<=y1){for(let x=x1;x>=x0;x--)o.push([x,y1]);y1--}if(x0<=x1){for(let y=y1;y>=y0;y--)o.push([x0,y]);x0++}}return o})();
const trSmall=mk(CW,CH);
function battleTransition(){return new Promise(res=>{const snap=mk(CW,CH);snap.getContext('2d').drawImage(cv,0,0);TR={snap,t0:performance.now(),dur:REDUCED?250:700,done:res}})}
function drawTransition(now){
  const t=(now-TR.t0)/TR.dur;if(t>=1){ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);const d=TR.done;TR=null;d();return}
  const p1=Math.min(1,t/.55);const k=Math.max(1,Math.floor(1+p1*20));const sw=Math.ceil(CW/k),sh=Math.ceil(CH/k);
  const g2=trSmall.getContext('2d');g2.imageSmoothingEnabled=false;g2.clearRect(0,0,CW,CH);g2.drawImage(TR.snap,0,0,sw,sh);ctx.imageSmoothingEnabled=false;ctx.drawImage(trSmall,0,0,sw,sh,0,0,sw*k,sh*k);
  if(t<.3&&Math.floor(t*24)%2){ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(0,0,CW,CH)}
  if(t>.3){const n=Math.floor((t-.3)/.7*SPIRAL.length);ctx.fillStyle='#000';for(let i=0;i<n;i++){const[x,y]=SPIRAL[i];ctx.fillRect(x*32,y*32,32,32)}}
}
function battleEnd(){if(bStat){bStat.remove();bStat=null}hideMsg();bclear();S.party.forEach(p=>{p.bind=0;p.guard=false;p.taunt=false});B=null;PS=[];mode='field'}
async function battle(ids,o={}){
  const cnt={},seen={};ids.forEach(id=>cnt[id]=(cnt[id]||0)+1);
  const now0=performance.now();
  const ens=ids.map((id,i)=>{const d=EN[id];let name=d.name;if(cnt[id]>1){seen[id]=seen[id]||0;name+='ABCD'[seen[id]++]}
    const spr=enemyCanvas(d);const s=d.human?(d.boss?5:4):6;
    return{d,name,hp:d.hp,mhp:d.hp,atk:d.atk,def:d.def,agi:d.agi,blind:0,spr,white:whiteOf(spr),s,w:spr.width*s,h:spr.height*s,introT:now0+i*90,idx:i}});
  sfx('enc');await battleTransition();
  B={ens,bgKind:MAPS[S.map].bgKind||'field',o,active:-1,fx:[],pops:[],banner:null,cut:null};mode='battle';PS=[];layoutEnemies();bclear();
  ens.forEach(e=>e.introT=performance.now()+e.idx*90);
  fade=1;fadeTo(0,250);
  bStat=partyWin({left:'3%',right:'3%',top:'3%'});
  if(ens.some(e=>e.d.boss)){B.banner={t0:performance.now(),text:ens.find(e=>e.d.boss).name};sfx('boom');await wait(1300)}else await wait(350);
  await blog(ens.length===1?ens[0].name+'が あらわれた！':ens[0].d.name+'たちが あらわれた！',500);
  if(o.intro){await o.intro();bclear()}
  let result=null,turn=0;
  while(!result){
    turn++;
    const inp=await inputCommands();bclear();
    let acts=[];
    if(inp.run){
      await blog(S.party[0].name+'たちは にげだした！');
      if(o.noEscape){await blog('しかし にげられない！')}
      else if(Math.random()<.65){sfx('whoosh');await blog('うまく にげきれた！',300);result='escape';break}
      else await blog('しかし まわりこまれて しまった！');
    }else acts=inp.acts;
    acts.forEach(a=>{if(a.type==='guard')a.actor.guard=true;if(a.type==='skill'&&SKILLS[a.skill].pre){a.actor.guard=true;a.actor.taunt=true}});
    const order=[...acts.map(a=>({a,agi:a.actor.agi})),...liveEnemies().map(e=>({e,agi:e.agi}))].map(x=>(x.k=x.agi*(.6+Math.random()*.6),x)).sort((a,b)=>b.k-a.k);
    for(const x of order){
      if(x.a){if(x.a.actor.hp<=0)continue;bclear();const r=await partyAct(x.a);if(typeof r==='string'){result=r;break}}
      else{if(x.e.hp<=0)continue;bclear();await enemyAct(x.e)}
      if(!liveEnemies().length){result='win';break}
      if(!living().length){result='lose';break}
    }
    S.party.forEach(p=>{p.guard=false;p.taunt=false});
    B.ens.forEach(e=>{if(e.blind>0)e.blind--});
    if(!result&&o.onTurnEnd){const r=await o.onTurnEnd(turn);if(r)result=r}
  }
  if(result==='win'){
    const exp=ens.reduce((s,e)=>s+e.d.exp,0),gold=ens.reduce((s,e)=>s+e.d.gold,0);
    await wait(350);bclear();sfx('win');
    const cols=['#ff6aa0','#ffe04a','#6ae0ff','#9cff60','#c08aff'];for(let i=0;i<40;i++)addP(PS,{type:'confetti',x:Math.random()*CW,y:-10-Math.random()*80,vx:(Math.random()-.5)*.06,vy:.12+Math.random()*.1,life:2200,c:cols[i%5]});
    await blog(ens.length>1?'まものたちを やっつけた！':ens[0].name+'を やっつけた！',600);
    if(exp>0){await blog('それぞれ '+exp+'ポイントの けいけんちを かくとく！',500)}
    if(gold>0){S.gold+=gold;await blog(gold+'ゴールドを 手に入れた！',500)}
    for(const p of living()){p.exp+=exp;while(p.exp>=nextExp(p.lv)){
      p.lv++;const g=MEMBERS[p.id].grow;p.mhp+=g.mhp;p.mmp+=g.mmp;p.atk+=g.atk;p.def+=g.def;p.agi+=g.agi;p.hp=Math.min(p.mhp,p.hp+g.mhp);p.mp=Math.min(p.mmp,p.mp+g.mmp);
      sfx('lvl');cellFlash(p,'heal');updateBattleStatus();bclear();await blog(p.name+'は レベル'+p.lv+'に あがった！',700);
      (MEMBERS[p.id].learn[p.lv]||[]).forEach(s=>p.skills.push(s));
      for(const s of MEMBERS[p.id].learn[p.lv]||[])await blog(p.name+'は '+SKILLS[s].name+'を おぼえた！',600);
    }}
    await waitKeyShort();
  }
  if(result==='lose'&&!o.loseOk){await blog('カイトたちは ぜんめつした……',900);await fadeTo(1,800);battleEnd();await gameOver();return'lose'}
  await fadeTo(1,220);battleEnd();resetFollowers();fadeTo(0,260);
  return result;
}
async function gameOver(){
  fade=1;S.gold=Math.floor(S.gold/2);S.party.forEach(p=>{p.hp=p.mhp;p.mp=p.mmp});
  const r=S.respawn;S.map=r.map;S.x=r.x;S.y=r.y;S.dir='down';mv=null;resetFollowers();
  await fadeTo(0,600);await say('……カイトは 目を さました。','所持金が 半分に なってしまった……');
}

function drawEnemy(g,e,now){
  if(e.gone)return;
  let ox=0,oy=0,img=e.spr,alpha=1;
  const it=clamp((now-e.introT)/450,0,1);ox+=(1-ease(it))*(e.idx%2?1:-1)*340;
  if(e.hurtT&&now-e.hurtT<320){const k=(now-e.hurtT)/320;ox+=Math.sin((now-e.hurtT)/16)*6*(1-k);if(Math.floor((now-e.hurtT)/60)%2===0)img=e.white}
  if(e.atkT&&now-e.atkT<320){const k=(now-e.atkT)/320;oy=-Math.sin(k*Math.PI)*10;if(k<.4&&Math.floor(k*10)%2===0)img=e.white}
  const cb=B.bgKind==='ruins'&&BGM.playing&&BGM.want!=='off';const br=REDUCED?1:cb?1+beatInfo().pulse*.06:1+Math.sin(now*.004+e.idx*1.3)*.025;
  const x=Math.round(e.x+ox),hgt=e.h*br,y=Math.round(e.base-hgt+oy);
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(e.cx+ox,e.base+2,e.w*.38,7,0,0,7);g.fill();
  if(e.peaceT){alpha=clamp(1-(now-e.peaceT)/1600,0,1)}
  if(e.dieT){const t=(now-e.dieT)/700;if(t>=1){e.gone=true;return}
    if(!e.pix){const d=e.spr.getContext('2d').getImageData(0,0,e.spr.width,e.spr.height).data;e.pix=[];for(let py=0;py<e.spr.height;py++)for(let px=0;px<e.spr.width;px++){const i=(py*e.spr.width+px)*4;if(d[i+3])e.pix.push({x:px,y:py,c:'rgb('+d[i]+','+d[i+1]+','+d[i+2]+')',th:Math.random()*.8+(1-py/e.spr.height)*.2})}}
    for(const p of e.pix){if(p.th<t)continue;g.fillStyle=t<.15?'#ffffff':p.c;g.fillRect(x+p.x*e.s,e.base-e.h+p.y*e.s-(t*30*(1-p.th)),e.s,e.s)}return}
  g.save();g.globalAlpha=alpha;g.imageSmoothingEnabled=false;
  if(e.d.big){g.shadowColor='#c870ff';g.shadowBlur=REDUCED?10:16+Math.sin(now*.006)*8}
  g.drawImage(img,x,y,e.w,hgt);g.restore();
  if(e.aim){const a=Math.floor(now/200)%2;g.fillStyle='#ffd25a';g.beginPath();g.moveTo(e.cx-8,e.top-18+a*3);g.lineTo(e.cx+8,e.top-18+a*3);g.lineTo(e.cx,e.top-8+a*3);g.fill()}
  if(e.blind>0){g.fillStyle='rgba(220,220,230,.45)';g.beginPath();g.arc(e.cx-12,e.top+e.h*.3,10,0,7);g.arc(e.cx+10,e.top+e.h*.22,13,0,7);g.fill()}
  if(e.heartT){const k=now-e.heartT;const im=emoSprite('♥');g.drawImage(im,e.cx-11,e.top-30-Math.sin(k*.006)*3,22,24)}
}

function drawCut(g,now){

  const gr=g.createLinearGradient(0,108,0,258);gr.addColorStop(0,c.c1||'#7a1020');gr.addColorStop(1,c.c2||'#2a0410');g.fillStyle=gr;g.fill();g.clip();
  g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=2;for(let i=0;i<14;i++){const y=110+((i*37+t*.4)%150);const x=((i*97+t*1.2)%(CW+200))-100;g.beginPath();g.moveTo(CW-x,y);g.lineTo(CW-x-80,y+3);g.stroke()}
  const keys=c.who;const many=keys.length>2;const sc=many?3:5;keys.forEach((key,i)=>{const bx=many?240-keys.length*30+i*60+6:60+(1-k)*-300;const by=many?172:120;
    const jig=c.shake?Math.sin(t*.05+i)*2:0;drawCharAt(g,key,'down',0,bx+jig,by,sc)});
  if(c.text){g.font=(c.big||40)+'px '+FONT;g.textAlign='center';g.lineWidth=7;g.strokeStyle='#14040a';const sx=c.shake?Math.sin(t*.09)*3:0,sy=c.shake?Math.cos(t*.11)*3:0;
    const tx=many?240:330,ty=many?160:196;g.strokeText(c.text,tx+sx,ty+sy);g.fillStyle=c.col||'#ff6a6a';g.fillText(c.text,tx+sx,ty+sy)}
  g.restore();
}

function drawEelBody(g,hx,hy,now,bottom=CH+80){
  for(let s=1;s>=0;s-=.035){const y=bottom-(bottom-hy)*s,x=hx+Math.sin(s*6+now*.004)*40*(1-s*.6),r=36-s*8;
    g.fillStyle=Math.round(s*28)%2?'#283654':'#24304c';g.beginPath();g.arc(x,y,r,0,7);g.fill();
    g.fillStyle='#3e4e78';g.beginPath();g.arc(x-r*.45,y-r*.1,r*.32,0,7);g.fill();
    g.fillStyle='#8a9ac0';g.fillRect(x+r*.5,y-2,4,4)}
}
function drawEelHead(g,x,y,s,mouth,closed,now){
  g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='#4a5a8a';[-1,1].forEach(d=>{g.beginPath();g.moveTo(d*56,-8);g.lineTo(d*96,-40);g.lineTo(d*86,-6);g.lineTo(d*98,10);g.lineTo(d*60,14);g.fill()});
  g.fillStyle='#1c263e';g.beginPath();g.ellipse(0,2,66,52,0,0,7);g.fill();
  g.fillStyle='#24304c';g.beginPath();g.ellipse(0,0,62,48,0,0,7);g.fill();
  g.fillStyle='#34446a';g.beginPath();g.ellipse(-12,-16,44,24,-.2,0,7);g.fill();
  g.fillStyle='#1a2238';[[-30,10],[28,6],[0,-30],[-44,-10],[42,-18],[14,26],[-16,30]].forEach(([a,b])=>{g.fillRect(a,b,6,6)});
  if(closed){g.strokeStyle='#ffe04a';g.lineWidth=4;[-26,26].forEach(ex=>{g.beginPath();g.arc(ex,-14,10,.2,Math.PI-.2);g.stroke()})}
  else{[-26,26].forEach(ex=>{g.fillStyle='rgba(255,224,74,.35)';g.beginPath();g.arc(ex,-14,18,0,7);g.fill();g.fillStyle='#ffe04a';g.beginPath();g.arc(ex,-14,12,0,7);g.fill();g.fillStyle='#111';g.fillRect(ex-3,-22,6,16);g.fillStyle='#fff';g.fillRect(ex-8,-20,4,4)})}
  g.fillStyle='#120814';g.beginPath();g.ellipse(0,22,36+mouth*12,4+mouth*30,0,0,7);g.fill();
  if(mouth>.3){g.fillStyle='#f4f0e0';for(let i=-4;i<=4;i++){g.beginPath();g.moveTo(i*9-4,22-mouth*26);g.lineTo(i*9+4,22-mouth*26);g.lineTo(i*9,22-mouth*14);g.fill()}}
  g.strokeStyle='#4a5a8a';g.lineWidth=3;[-1,1].forEach(d=>{g.beginPath();g.moveTo(d*30,24);g.quadraticCurveTo(d*70,30+Math.sin(now*.005)*6,d*90,10);g.stroke()});
  g.restore();
}

// ---------------------------------------------------------------- main loop
let lastT=performance.now();
function frame(now){
  const dt=Math.min(50,now-lastT);lastT=now;
  if(S&&(mode==='field'||mode==='battle'))S.playMs=(S.playMs||0)+dt;
  if(mode==='field'&&S){
    if(mv){mv.t+=dt/150;if(mv.t>=1){mv.t=1;finishStep()}}
    else if(!busy&&!H.length&&heldDir())tryMove(heldDir());
  }
  updParticles(PW,dt,now);updParticles(PS,dt,now);updateBgm(dt);
  ctx.imageSmoothingEnabled=false;ctx.save();
  if(now<shakeUntil)ctx.translate(rand(-4,4),rand(-3,3));
  if(mode==='title')drawTitle(now);
  else if(mode==='battle'&&B)drawBattle(now);
  else if(mode==='scene'&&scene)drawScene(now);
  else if(mode==='field'&&S)drawField(now);
  else{ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH)}
  if(fx)fx(ctx,now);
  drawParticles(ctx,PS,0,0,now);
  ctx.restore();
  if(TR)drawTransition(now);
  if(fade>0){ctx.fillStyle='rgba(0,0,0,'+fade+')';ctx.fillRect(0,0,CW,CH)}
  if(flashA>0){ctx.fillStyle='rgba('+flashC+','+flashA+')';ctx.fillRect(0,0,CW,CH);flashA=Math.max(0,flashA-dt/260)}
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- input
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyZ:'ok',Enter:'ok',Space:'ok',KeyX:'cancel',Escape:'cancel',Backspace:'cancel',KeyC:'cancel'};
const heldList=[];const heldDir=()=>heldList[heldList.length-1];
function holdOn(k){if(!DIRV[k])return;const i=heldList.indexOf(k);if(i>=0)heldList.splice(i,1);heldList.push(k)}
function holdOff(k){const i=heldList.indexOf(k);if(i>=0)heldList.splice(i,1)}
function press(k){
  ac();
  if(H.length){H[H.length-1].onKey(k);return}
  if(mode==='field'&&S&&!busy&&!mv){if(k==='ok')runScript(interact);else if(k==='cancel')runScript(fieldMenu)}
}
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();holdOn(k);if(e.repeat&&!DIRV[k])return;if(e.repeat&&!H.length)return;press(k)});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)holdOff(k)});
addEventListener('blur',()=>{heldList.length=0});
document.querySelectorAll('#pad .pb').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}holdOn(k);press(k)});
  const up=()=>{b.classList.remove('on');holdOff(k)};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault())});
$('#screen').addEventListener('pointerdown',()=>{ac();const h=H[H.length-1];if(h&&h.tap)h.onKey('ok')});

// ---------------------------------------------------------------- title & boot
async function title(){
  mode='title';fade=0;scene=null;
  const tb=el('div','titlebox');tb.innerHTML='<div class="sub">怪盗館長と</div><div class="main">幻の<b>サンダル</b></div><div class="cr">A SHORT 16-BIT RPG</div>';
  const has=!!loadGame();
  const c=await choose(['はじめから',{label:'つづきから',disabled:!has}],{style:{left:'50%',top:'60%',transform:'translateX(-50%)'},cancel:false,start:has?1:0});
  sfx('item');flash(.8);await fadeTo(1,500);tb.remove();
  if(c===0){S=newState();applyAllFlags();resetFollowers();busy=true;try{await opening()}finally{busy=false}}
  else{S=loadGame();applyAllFlags();resetFollowers();mode='field';await fadeTo(0,500);showMapName(MAPS[S.map].name)}
}
function boot(data){
  try{document.fonts&&document.fonts.load('20px "DotGothic16"')}catch(e){}
  requestAnimationFrame(frame);
  if(data&&data.s){try{S=JSON.parse(data.s);applyAllFlags();resetFollowers();mode='field';return}catch(e){S=null}}
  title();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({s:S&&mode==='field'&&!busy?JSON.stringify(S):null}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot(window.claude&&window.claude.hot&&window.claude.hot.data||{});
window.__g={get S(){return S},MAPS,MZ,battle,warpTo,setF,addMember,giveItem,F,get mode(){return mode},get busy(){return busy},H,get B(){return B},emote};
