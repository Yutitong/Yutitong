<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>怪盗館長と幻のサンダル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one retro game screen (15x11 tiles) centered, touch pad underneath. Deliberately single dark look. */
:root{
  --night:#0d0b14;   /* page ground */
  --win:#0f0e1c;     /* window fill */
  --ink:#f4efe6;     /* window text + border */
  --gold:#ffd25a;    /* cursor, highlights */
  --pink:#ff7fb6;    /* title accent, the pink room */
  --muted:#8f88a8;   /* disabled items, hints */
  --danger:#ff7a6a;  /* low HP */
  --font-game:"DotGothic16","MS Gothic","Osaka-Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--font-game)}
#app{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:16px;padding-inline:16px}
#screen{position:relative;width:100%;max-width:768px;aspect-ratio:480/352;container-type:inline-size;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px #2a2638,0 12px 40px rgba(0,0,0,.6);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#layer{position:absolute;inset:0;font-size:3.5cqw;line-height:1.55;pointer-events:none}
.win{position:absolute;box-sizing:border-box;background:var(--win);color:var(--ink);border:.45cqw solid var(--ink);border-radius:1.1cqw;box-shadow:0 0 0 .4cqw var(--win);padding:1.4cqw 2.2cqw;pointer-events:auto}
.msg{left:3%;right:3%;bottom:3%;min-height:24cqw;white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere}
.msg .arrow{position:absolute;right:2.4cqw;bottom:.6cqw;color:var(--gold);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.menu{min-width:22%}
.menu .item{position:relative;padding-left:1.3em;white-space:nowrap;display:flex;justify-content:space-between;gap:1.2em;cursor:pointer}
.menu .item.sel::before{content:"▶";position:absolute;left:0;color:var(--gold)}
.menu .item.dis{color:var(--muted)}
.menu .item .rt{font-variant-numeric:tabular-nums}
.ttl{position:absolute;top:-.85em;left:50%;transform:translateX(-50%);background:var(--win);padding:0 .45em;font-size:.82em;white-space:nowrap}
.party{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.1em 1.2em;font-size:.86em;line-height:1.3;font-variant-numeric:tabular-nums}
.party .pc{min-width:0}
.party .nm{white-space:nowrap;overflow:hidden}
.party .pc.act .nm{color:var(--gold)}
.party .pc.low{color:var(--danger)}
.party .pc.ko{color:var(--muted)}
.gold{font-variant-numeric:tabular-nums}
.mapname{left:3%;top:3%;transition:opacity .6s}
.narr{inset:0;border:none;background:transparent;box-shadow:none;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;font-size:1.12em;line-height:1.9;padding:6cqw}
.narr .arrow{position:absolute;right:4cqw;bottom:3cqw;color:var(--gold);animation:blink .8s steps(2) infinite}
.titlebox{position:absolute;left:0;right:0;top:9%;text-align:center;pointer-events:none;text-shadow:0 .4cqw 0 #000}
.titlebox .sub{font-size:4.2cqw;color:var(--gold);letter-spacing:.3em}
.titlebox .main{font-size:9.5cqw;line-height:1.2;color:var(--ink);letter-spacing:.06em}
.titlebox .main b{color:var(--pink);font-weight:normal}
.titlebox .cr{font-size:2.6cqw;color:var(--muted);margin-top:1cqw;letter-spacing:.1em}
.stats{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;line-height:1.8;min-width:60%}
.stats .big{font-size:2em;color:var(--gold);letter-spacing:.2em}
#pad{width:100%;max-width:768px;display:flex;align-items:center;justify-content:space-between;gap:16px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.pb{font-family:var(--font-game);font-size:20px;color:var(--ink);background:#1d1a2c;border:2px solid #3a3550;border-radius:10px;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
.pb:active,.pb.on{background:#34304a;border-color:var(--gold)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.ab{display:flex;gap:14px;align-items:center}
.ab .pb{width:68px;height:68px;border-radius:50%;font-size:22px}
.ab .a{background:#3a2a1a;border-color:#7a5a2a;transform:translateY(-14px)}
.hint{flex:1;min-width:0;text-align:center;font-size:12px;line-height:1.7;color:var(--muted)}
@media (max-width:420px){.hint{display:none}.dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}.ab .pb{width:60px;height:60px}}
@media (prefers-reduced-motion:reduce){.msg .arrow,.narr .arrow{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <canvas id="cv" width="480" height="352"></canvas>
    <div id="layer"></div>
  </div>
  <div id="pad">
    <div class="dpad">
      <button class="pb u" data-k="up" tabindex="-1" aria-label="上">▲</button>
      <button class="pb l" data-k="left" tabindex="-1" aria-label="左">◀</button>
      <button class="pb r" data-k="right" tabindex="-1" aria-label="右">▶</button>
      <button class="pb d" data-k="down" tabindex="-1" aria-label="下">▼</button>
    </div>
    <div class="hint">移動：矢印キー / WASD<br>しらべる・決定：Z / Enter<br>メニュー・もどる：X / Esc</div>
    <div class="ab">
      <button class="pb b" data-k="cancel" tabindex="-1" aria-label="Bボタン（メニュー・もどる）">B</button>
      <button class="pb a" data-k="ok" tabindex="-1" aria-label="Aボタン（しらべる・決定）">A</button>
    </div>
  </div>
</div>
<script>
'use strict';
// =====================================================================
//  怪盗館長と幻のサンダル
// =====================================================================
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TILE=32,VW=15,VH=11,CW=480,CH=352;
const cv=$('#cv'),ctx=cv.getContext('2d');
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- audio
let AC=null,soundOn=true,noiseBuf=null;
function ac(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*0.4;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type='square',vol=.05,when=0,f2){const a=ac();if(!a)return;const t=a.currentTime+when;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol=.08,when=0){const a=ac();if(!a||!noiseBuf)return;const t=a.currentTime+when;const s=a.createBufferSource(),g=a.createGain();s.buffer=noiseBuf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(g).connect(a.destination);s.start(t);s.stop(t+dur)}
function sfx(k){if(!soundOn)return;try{switch(k){
  case'blip':tone(760,.03,'square',.018);break;
  case'cursor':tone(660,.04,'square',.03);break;
  case'ok':tone(990,.06,'square',.035);break;
  case'cancel':tone(440,.06,'square',.03);break;
  case'hit':noise(.12,.12);tone(220,.08,'square',.03);break;
  case'hurt':tone(160,.18,'sawtooth',.05,0,60);noise(.1,.06);break;
  case'heal':[523,659,784,1046].forEach((f,i)=>tone(f,.12,'triangle',.05,i*.06));break;
  case'lvl':[523,659,784,659,784,1046].forEach((f,i)=>tone(f,.14,'square',.035,i*.09));break;
  case'enc':[880,660,880,660,880,440].forEach((f,i)=>tone(f,.05,'square',.03,i*.045));break;
  case'win':[523,523,523,698,880,784,1046].forEach((f,i)=>tone(f,.16,'square',.035,i*.11));break;
  case'boom':noise(.9,.18);tone(80,.9,'sawtooth',.06,0,30);break;
  case'item':[784,988,1175,1568].forEach((f,i)=>tone(f,.1,'square',.03,i*.07));break;
  case'door':tone(300,.1,'square',.03,0,180);break;
  case'gulp':tone(300,.4,'sine',.12,0,60);break;
}}catch(e){}}

// ---------------------------------------------------------------- sprites
function buildSprite(rows,pal){const h=rows.length,w=rows[0].length;const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x];if(ch!=='.'&&pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}return c}
const HUMAN={
 front:["................",".....HHHHHH.....","....HHHHHHHH....","...HHHHHHHHHH...","...HSSSSSSSSH...","...SSESSSSESS...","...SSESSSSESS...","....SSSMMSSS....",".....SSSSSS.....","....CCCAACCC....","...CCCCAACCCC...","..SCCCCAACCCCS..","..S.CCCCCCCC.S..","....PPPPPPPP....","....PPP..PPP....","...BBBB..BBBB..."],
 back:["................",".....HHHHHH.....","....HHHHHHHH....","...HHHHHHHHHH...","...HHHHHHHHHH...","...HHHHHHHHHH...","...SHHHHHHHHS...","....SHHHHHHS....",".....SSSSSS.....","....CCCCCCCC....","...CCCCCCCCCC...","..SCCCCCCCCCCS..","..S.CCCCCCCC.S..","....PPPPPPPP....","....PPP..PPP....","...BBBB..BBBB..."],
 side:["................",".....HHHHHH.....","....HHHHHHHH....","...HHHHHHHHHH...","...SSSSSSHHHH...","...SESSSSSHHH...","...SESSSSSHHH...","..SSSSSSSSSH....","....MSSSSSS.....","....CCCCCCC.....","....CCCCCCCC....","....CSSCCCCC....","....CSSCCCCC....","....PPPPPPPP....","....PPP..PPP....","...BBBB..BBB...."]
};
const HATS={
 none:[],
 tophat:["....KKKKKKKK....","....KKKKKKKK....","....KRRRRRRK....","..KKKKKKKKKKKK.."],
 cap:["................","....NNNNNNNN....","...NNNNYYNNNN...","..KKKKKKKKKKKK.."],
 mohawk:[".......RR.......","......RRRR......",".......RR......."],
 halo:["...YYYYYYYYYY..."],
 bun:["......HHHH......",".....HHHHHH....."],
 bandana:["................","................","...RRRRRRRRRR...","...RRRRRRRRRRR.."],
 ribbon:["..RR........RR..","..RRR......RRR.."]
};
const SK='#f2c79a';
const CHARS={
 kaito:{hat:'tophat',pal:{H:'#3a2a1a',S:SK,E:'#1a1a1a',M:'#3a2a1a',C:'#1c1c30',A:'#d03a3a',P:'#1a1a24',B:'#5a4030',K:'#141420',R:'#d03a3a'}},
 mimi:{hat:'ribbon',pal:{H:'#e0703a',S:SK,E:'#1a1a1a',M:'#c0504a',C:'#4a3a8a',A:'#ffd23a',P:'#2a2a4a',B:'#6a2a2a',R:'#ff6fa0'}},
 don:{hat:'bandana',pal:{H:'#222',S:'#d39a68',E:'#1a1a1a',M:'#7a3a2a',C:'#6a4a2a',A:'#8a6a3a',P:'#3a3a3a',B:'#222',R:'#2a6ac0'}},
 lumina:{hat:'halo',glow:'#fff3a0',pal:{H:'#fff2b0',S:'#fff0e2',E:'#3a6ad0',M:'#e08a8a',C:'#f4f4ff',A:'#ffd23a',P:'#dcdcff',B:'#ffd23a',Y:'#ffe86a'}},
 mother:{hat:'bun',glow:'#ffb0e0',pal:{H:'#ff9ad0',S:'#fff0e2',E:'#3a2a4a',M:'#c04a6a',C:'#ff5fa8',A:'#ffd23a',P:'#e04a90',B:'#ffd23a'}},

 keibu:{hat:'cap',pal:{H:'#666',S:SK,E:'#1a1a1a',M:'#666',C:'#6a5a44',A:'#a02a2a',P:'#3a3028',B:'#111',K:'#111',N:'#4a3e30',Y:'#ffd23a'}},
 bonbo:{hat:'mohawk',pal:{H:'#3a2a3a',S:SK,E:'#1a1a1a',M:'#a0503c',C:'#ff8a2a',A:'#ffffff',P:'#7a3a10',B:'#222',R:'#ff3ab0'}},
 wakino:{hat:'mohawk',pal:{H:'#2a4a2a',S:'#e8b080',E:'#1a1a1a',M:'#5a2a1a',C:'#3aa04a',A:'#ffffff',P:'#1a3a1a',B:'#222',R:'#6aff6a'}},
 wakinini:{hat:'mohawk',pal:{H:'#3a1a4a',S:'#d89a6a',E:'#c01a1a',M:'#3a1a1a',C:'#6a1a8a',A:'#ffd23a',P:'#2a0a3a',B:'#111',R:'#c06aff'}},
 guard:{hat:'cap',pal:{H:'#2a2a2a',S:SK,E:'#1a1a1a',M:'#a0503c',C:'#5a6a7a',A:'#ffd23a',P:'#3a4048',B:'#111',K:'#111',N:'#4a5a6a',Y:'#ffd23a'}},

 curator:{hat:'none',pal:{H:'#222',S:SK,E:'#3a6ad0',M:'#a0503c',C:'#8a8a9a',A:'#3a3a4a',P:'#3a3a4a',B:'#222'}},
 traveler:{hat:'none',pal:{H:'#8a6a3a',S:SK,E:'#1a1a1a',M:'#a0503c',C:'#5a8a3a',A:'#a08a5a',P:'#5a4a3a',B:'#3a2a1a'}},
 lightkid:{hat:'halo',glow:'#fff3a0',pal:{H:'#ffe0a0',S:'#fff0e2',E:'#1a1a1a',M:'#e08a8a',C:'#ffe8b0',A:'#ffd23a',P:'#e0d0a0',B:'#ffd23a',Y:'#ffe86a'}},
 oldman:{hat:'none',pal:{H:'#e8e8e8',S:SK,E:'#1a1a1a',M:'#e8e8e8',C:'#7a5a8a',A:'#7a5a8a',P:'#4a3a5a',B:'#3a2a1a'}}
};
const sprCache={};
function charSprite(key,dir){
  const k=key+':'+dir;if(sprCache[k])return sprCache[k];
  const def=CHARS[key];const view=dir==='up'?'back':(dir==='down'?'front':'side');
  const rows=HUMAN[view].slice();const hat=HATS[def.hat]||[];
  hat.forEach((r,i)=>{let out='';for(let x=0;x<16;x++)out+=r[x]!=='.'?r[x]:rows[i][x];rows[i]=out});
  return sprCache[k]=buildSprite(rows,def.pal);
}
const MONS={
 slime:["................","................",".......OO.......","......OBBO......",".....OBBBBO.....","....OBBBBBBO....","...OBBWBBBBBO...","...OBWWBBBBBO...","..OBBBBBBBBBBO..","..OBBEBBBBEBBO..","..OBBEBBBBEBBO..",".OBBBBBBBBBBBBO.",".OBBBBMMMMBBBBO.",".OBBBBBMMBBBBBO.","..OBBBBBBBBBBO..","...OOOOOOOOOO..."],
 bird:["................","......OOOO......",".....OBBBBO.....","....OBBEWBO.....","....OBBEEBOYY...","....OBBBBBOYYY..",".OO..OBBBBO.....","OBBO.OBBBBBO..OO","OBBBOBBRRBBBOOBO",".OBBBBBRBRBBBBO.","..OBBBBRRBBBBO..","...OBBBBBBBBO...","....OOBBBBOO....","......O..O......",".....YY..YY.....","................"],

 golem:["................",".....OOOOOO.....","....OBBBBBBO....","....OBEBBEBO....","....OBBBBBBO....","..OOOBBMMBBOOO..",".OBBOBBBBBBOBBO.",".OBBOBBRRBBOBBO.",".OBBOBBRRBBOBBO.",".OBBOBBBBBBOBBO.","..OO.OBBBBO.OO..",".....OBBOBBO....","....OBBO.OBBO...","....OBBO.OBBO...","...OBBBO.OBBBO..","...OOOOO.OOOOO.."],
 bug:["................","...O........O...","....O......O....",".....OOOOOO.....","....OBBBBBBO....","...OBEWBBEWBO...","...OBEEBBEEBO...","...OBBBBBBBBO...","..OOBBMMMMBBOO..",".O.OBBBBBBBBO.O.","O..ORRBRRBRRO..O","..OBRRBRRBRRBO..",".O.OBBBBBBBBO.O.","O...ORRBRRBRO..O",".....OOOOOO.....","................"],
 boot:["................","....OOOOOO......","....OBBBBO......","....OBEBEO......","....OBBBBO......","....OBMMBO......","....OBBBBO......","....OBRRBO......","....OBBBBO......","....OBBBBOOOOO..","....OBBBBBBBBBO.","...OBBBBBBBBBBBO","...OWWWWWWWWWWWO","...OOOOOOOOOOOOO","................","................"],
 bowl:["................","....Y.Y..Y.Y....","...YY.YY.YY.Y...","..OOOOOOOOOOOO..",".OYYYYGYYPPYYYO.",".OYEYYYYYYYEYYO.","..OBBBBBBBBBBO..","..OBRBRBRBRBBO..","...OBBBMMBBBO...","....OBBBBBBO....",".....OOOOOO.....","......O..O......",".....OO..OO.....","................","................","................"]
};
const OBJ={
 chest:{rows:["................","................","................","..OOOOOOOOOOOO..",".OBBBBBBBBBBBBO.",".OBYYBBBBBBYYBO.",".OBBBBBBBBBBBBO.",".OOOOOOYYOOOOOO.",".OBBBBBYYBBBBBO.",".OBYBBBBBBBBYBO.",".OBBBBBBBBBBBBO.",".OBYBBBBBBBBYBO.",".OBBBBBBBBBBBBO.",".OOOOOOOOOOOOOO.","................","................"],pal:{O:'#2a1a0a',B:'#a0602a',Y:'#ffd23a'}},
 chestOpen:{rows:["................","..OOOOOOOOOOOO..",".OBBBBBBBBBBBBO.",".ODDDDDDDDDDDDO.",".OOOOOOOOOOOOOO.",".ODDDDDDDDDDDDO.",".ODDDDDDDDDDDDO.",".OOOOOOOOOOOOOO.",".OBBBBBBBBBBBBO.",".OBYBBBBBBBBYBO.",".OBBBBBBBBBBBBO.",".OBYBBBBBBBBYBO.",".OBBBBBBBBBBBBO.",".OOOOOOOOOOOOOO.","................","................"],pal:{O:'#2a1a0a',B:'#a0602a',Y:'#ffd23a',D:'#3a200a'}},
 sign:{rows:["................","................","..OOOOOOOOOOOO..","..OBBBBBBBBBBO..","..OBDDDDDDDDBO..","..OBBBBBBBBBBO..","..OBDDDDDDBBBO..","..OBBBBBBBBBBO..","..OOOOOOOOOOOO..",".......OO.......",".......OO.......",".......OO.......",".......OO.......","......OOOO......","................","................"],pal:{O:'#3a2a1a',B:'#c8a060',D:'#6a4a2a'}},
 sandal:{rows:["................","......OOOO......",".....OBBBBO.....","....OBBRBBBO....","....OBRBRBBO....","....ORBBBRBO....","...OBRBBBBRBO...","...OBBBBBBBBO...","...OBBBBBBBBO...","...OBBBBBBBBO...","....OBBBBBBO....","....OBBBBBBO....","....OBBBBBBO....",".....OBBBBO.....","......OOOO......","................"],pal:{O:'#3a2a1a',B:'#8a6a4a',R:'#c03a3a'}},
 teron:{rows:["................","......P..Y......","....P.PPYY.Y....",".....PWWWWY.....","...CCWWEEWWGG...","....CWWEEWWG....",".....BWWWWG.....","....B.BBGG.G....","......B..G......",".......NN.......","....LL.NN.......",".....LLNN.LL....",".......NNLL.....",".......NN.......","................","................"],pal:{P:'#ff6aa0',Y:'#ffe04a',C:'#5ae0f0',G:'#6ae06a',B:'#6a8aff',W:'#ffffff',E:'#ffd23a',N:'#2a7a2a',L:'#4ab04a'}}
};
function objSprite(k){const key='obj:'+k;if(sprCache[key])return sprCache[key];return sprCache[key]=buildSprite(OBJ[k].rows,OBJ[k].pal)}
function enemySprite(d){const key='en:'+d.key;if(sprCache[key])return sprCache[key];if(d.human)return sprCache[key]=charSprite(d.human,'down');return sprCache[key]=buildSprite(MONS[d.mon],d.pal)}

// ---------------------------------------------------------------- tiles
const PASS=new Set(['.',',','=','P','m','a','R','F','S','U','d','_','h','O','g','E']);
function drawTile(g,ch,f){
  const R=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
  const C=(c,x,y,r)=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()};
  const grass=()=>{R('#4f9a44',0,0,32,32);R('#62b252',4,6,2,3);R('#62b252',20,4,2,3);R('#62b252',12,18,2,3);R('#62b252',26,22,2,3);R('#3f8a3a',8,26,2,2);R('#3f8a3a',24,13,2,2)};

function typeText(node,prefix,text,speed){

    typing={finish(){clearInterval(iv);node.textContent=prefix+text;typing=null;res()}};

async function pages(win,node,arrow,list,speed){
  for(const p of list){
    win.hidden=false;arrow.hidden=true;
    await new Promise(res=>{let done=false;
      const h={tap:true,onKey(k){if(k!=='ok'&&k!=='cancel')return;if(typing){typing.finish();return}if(done){popH(h);res()}}};
      pushH(h);typeText(node,'',p,speed).then(()=>{done=true;arrow.hidden=false});
    });
  }

    const draw=()=>items.forEach((d,idx)=>d.classList.toggle('sel',idx===i));draw();o.onMove&&o.onMove(i);

function anim(ms,fn){return new Promise(res=>{const t0=performance.now();const step=now=>{const t=Math.min(1,(now-t0)/ms);fn(t);if(t<1)requestAnimationFrame(step);else res()};requestAnimationFrame(step)})}
function fadeTo(v,ms=400){const s=fade;return anim(ms,t=>{fade=s+(v-s)*t})}
function flash(a=1){if(!REDUCED)flashA=a;else flashA=Math.min(a,.3)}
function shake(ms=250){if(!REDUCED)shakeUntil=performance.now()+ms}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// --- ヘンポコ迷宮（オオウナギの胃袋）
const MZ=(()=>{
  const N=12,W=N*2+1;const g=Array.from({length:W},()=>Array(W).fill('M'));
  let seed=20261003;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
  const vis=Array.from({length:N},()=>Array(N).fill(false));const st=[[0,0]];vis[0][0]=true;g[1][1]='m';
  while(st.length){const[cx,cy]=st[st.length-1];
    const nb=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>{const nx=cx+dx,ny=cy+dy;return nx>=0&&ny>=0&&nx<N&&ny<N&&!vis[ny][nx]});
    if(!nb.length){st.pop();continue}
    const[dx,dy]=nb[Math.floor(rnd()*nb.length)];const nx=cx+dx,ny=cy+dy;vis[ny][nx]=true;g[cy*2+1+dy][cx*2+1+dx]='m';g[ny*2+1][nx*2+1]='m';st.push([nx,ny])}
  let k=0,guard=0;while(k<8&&guard++<5000){const x=1+Math.floor(rnd()*(W-2)),y=1+Math.floor(rnd()*(W-2));if(g[y][x]!=='M')continue;
    if((x%2===0&&y%2===1&&g[y][x-1]==='m'&&g[y][x+1]==='m')||(x%2===1&&y%2===0&&g[y-1][x]==='m'&&g[y+1][x]==='m')){g[y][x]='m';k++}}
  const bfs=(sx,sy)=>{const d=Array.from({length:W},()=>Array(W).fill(-1));d[sy][sx]=0;const q=[[sx,sy]];while(q.length){const[x,y]=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(g[ny]&&g[ny][nx]==='m'&&d[ny][nx]<0){d[ny][nx]=d[y][x]+1;q.push([nx,ny])}}}return d};
  const ds=bfs(1,1),de=bfs(W-2,W-2);
  const nbrs=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>g[y+dy][x+dx]==='m').map(([dx,dy])=>[x+dx,y+dy]);
  let dead=[];for(let y=1;y<W;y+=2)for(let x=1;x<W;x+=2)if(nbrs(x,y).length===1&&!(x===1&&y===1)&&!(x===W-2&&y===W-2))dead.push([x,y]);
  const take=f=>{dead.sort(f);return dead.shift()};
  const are=take((a,b)=>ds[b[1]][b[0]]-ds[a[1]][a[0]]);
  const sandal=take((a,b)=>de[a[1]][a[0]]-de[b[1]][b[0]]);
  const bed=take((a,b)=>ds[a[1]][a[0]]-ds[b[1]][b[0]]);const bedFront=nbrs(bed[0],bed[1])[0];
  const shopP=take((a,b)=>ds[a[1]][a[0]]-ds[b[1]][b[0]]);
  const keibuP=dead.length?take((a,b)=>ds[a[1]][a[0]]-ds[b[1]][b[0]]):null;
  const chests=[];while(dead.length&&chests.length<3)chests.push(dead.splice(Math.floor(rnd()*dead.length),1)[0]);
  const reserved=new Set([are,sandal,bed,shopP,keibuP,...chests].filter(Boolean).map(p=>p.join(',')));
  for(let y=1;y<W-1;y++)for(let x=1;x<W-1;x++){if(g[y][x]==='m'&&ds[y][x]>5&&de[y][x]>2&&!reserved.has(x+','+y)&&rnd()<.06)g[y][x]='a'}
  g[bed[1]][bed[0]]='b';g[W-2][W-2]='E';
  return{rows:g.map(r=>r.join('')),are,sandal,bed,bedFront,shop:shopP,keibu:keibuP,chests,exit:[W-2,W-2]};
})();

// ---------------------------------------------------------------- field logic
const visEvents=m=>m.events.filter(e=>!e.show||e.show());
function eventAt(x,y){return visEvents(MAPS[S.map]).find(e=>e.x===x&&e.y===y)}
function tileAt(x,y){const m=MAPS[S.map];if(x<0||y<0||x>=m.w||y>=m.h)return m.outside;return m.tiles[y][x]}
function tryMove(dir){
  S.dir=dir;const[dx,dy]=DIRV[dir];const nx=S.x+dx,ny=S.y+dy;
  const ev=eventAt(nx,ny);if(ev&&ev.solid!==false)return;
  if(!PASS.has(tileAt(nx,ny)))return;
  mv={fx:S.x,fy:S.y,tx:nx,ty:ny,t:0};
}
function finishStep(){
  S.x=mv.tx;S.y=mv.ty;mv=null;walkFlip=!walkFlip;
  const m=MAPS[S.map];
  const w=m.warps.find(w=>w.x===S.x&&w.y===S.y);
  if(w){sfx('door');runScript(()=>warpTo(...w.to));return}
  const ev=visEvents(m).find(e=>e.x===S.x&&e.y===S.y&&e.touch);
  if(ev){runScript(ev.touch);return}
  if(m.tiles[S.y][S.x]==='a'){S.party.forEach(p=>{if(p.hp>1)p.hp-=1});flash(.25);sfx('hurt')}
  if(m.enc){const grp=m.enc(S.x,S.y);if(grp){encSteps--;if(encSteps<=0){encSteps=rand(14,26);runScript(()=>battle(pick(grp)))}}}
}
async function warpTo(map,x,y,dir){
  await fadeTo(1,260);S.map=map;S.x=x;S.y=y;if(dir)S.dir=dir;mv=null;encSteps=rand(12,24);
  await fadeTo(0,260);const m=MAPS[map];showMapName(m.name);if(m.onEnter)await m.onEnter();
}
async function interact(){
  const[dx,dy]=DIRV[S.dir];const tx=S.x+dx,ty=S.y+dy;
  let ev=eventAt(tx,ty);
  if(!ev&&tileAt(tx,ty)==='c')ev=eventAt(tx+dx,ty+dy);
  if(ev&&ev.talk){if(ev.dir&&!ev.obj)ev.dir={up:'down',down:'up',left:'right',right:'left'}[S.dir];await ev.talk();return}
  const t=tileAt(tx,ty);
  if(t==='b')return rest('ベッドで やすみますか？',{map:S.map,x:S.x,y:S.y});
  if(t==='L')return rest('光の泉だ。 からだを ひたしますか？',{map:S.map,x:S.x,y:S.y});
}
async function rest(q,spot){
  showMsg(q);const c=await choose(['はい','いいえ'],{style:{right:'3%',bottom:'30cqw'}});hideMsg();
  if(c!==0)return;
  await fadeTo(1,500);S.party.forEach(p=>{p.hp=p.mhp;p.mp=p.mmp});S.respawn=spot;sfx('heal');await wait(400);await fadeTo(0,500);
  await say('みんなの HPと MPが かいふくした！');
  const ok=saveGame();await say(ok?'（館長日誌に きろくしました）':'（この ブラウザでは きろくできませんでした）');
}
async function runScript(fn){if(busy)return;busy=true;try{await fn()}catch(e){console.error(e)}finally{busy=false}}

async function useItem(id,user,t,inBattle){
  const it=ITEMS[id];

    if(inBattle&&B&&B.o.onAre)return await B.o.onAre(user);
    await out(user.name+'は 「アレ」を 尻に 塗りこんだ！');await out('……ヒリヒリする！！');
    if(inBattle){user.hp=Math.min(user.mhp,user.hp+15)}else S.party.forEach(p=>{if(p.hp>0)p.hp=Math.min(p.mhp,p.hp+10)});
    updateBattleStatus();return out('なぜか すこし 元気が でた。');
  }
  if(!hasItem(id))return out('しかし '+it.name+'は もう なかった！');

  if(t.hp<=0)return out('しかし '+t.name+'は たおれている……');

  if(it.mp){const v=Math.min(it.mp,t.mmp-t.mp);t.mp+=v;sfx('heal');updateBattleStatus();return out(t.name+'の MPが '+v+' かいふくした！')}
}

let bStat=null;

const liveEnemies=()=>B?B.ens.filter(e=>e.hp>0):[];
function liveTarget(t){if(t&&t.hp>0)return t;const l=liveEnemies();return l.length?pick(l):null}
function physDmg(atk,def,mult){return Math.max(1,Math.round((atk*mult-def/2)*(.85+Math.random()*.3)))}
async function dmgEnemy(e,d){
  if(e.hp<=0)return;e.hp-=d;e.hurtT=performance.now();sfx('hit');
  await blog(e.name+'に '+d+'の ダメージ！');

    e.hp=0;e.dieT=performance.now();await blog(e.name+'を たおした！');
  }
}
async function hitEnemy(p,t,mult,canCrit){
  t=liveTarget(t);if(!t)return;
  if(canCrit&&Math.random()<1/16){await blog('かいしんの いちげき！！');flash(.4);return dmgEnemy(t,Math.round(p.atk*1.5*(.9+Math.random()*.2)))}
  return dmgEnemy(t,physDmg(p.atk,t.def,mult));
}
function chooseTarget(){const al=living();const tn=al.filter(p=>p.taunt);if(tn.length&&Math.random()<.8)return tn[0];return pick(al)}
async function hitMember(e,p,mult,noRetarget){
  if(p.hp<=0){if(noRetarget)return;p=chooseTarget();if(!p)return}
  let d=physDmg(e.atk,p.def,mult);if(p.guard)d=Math.ceil(d/2);
  p.hp=Math.max(0,p.hp-d);shake(260);sfx('hurt');updateBattleStatus();
  await blog(p.name+'は '+d+'の ダメージを うけた！');
  if(p.hp<=0)await blog(p.name+'は たおれた……');
}
async function enemyAct(e){
  if(!living().length)return;
  const act=pick(e.d.acts);const t=chooseTarget();e.atkT=performance.now();
  const miss=async()=>{if(e.blind>0&&Math.random()<.5){await blog('しかし けむりで ねらいが はずれた！');return true}return false};
  const all=async m=>{for(const p of living())await hitMember(e,p,m,true)};
  const bindT=async(msg,ok,ng)=>{if(Math.random()<.6){t.bind=1;t.bindMsg=msg;return blog(t.name+ok)}return blog(ng)};
  switch(act){
   case'atk':await blog(e.name+'の こうげき！');if(await miss())return;return hitMember(e,t,1);
   case'bind':await blog(e.name+'は てじょうを なげつけた！');return bindT('てじょうで うごけない！','は てじょうを かけられた！','しかし ひらりと かわした！');
   case'pamph':await blog(e.name+'は パンフレットを ばらまいた！');return all(.55);
   case'lecture':await blog(e.name+'は 展示品の 解説を はじめた……');return bindT('解説に 聞き入っている……','は 聞き入ってしまった！',t.name+'は 聞き流した！');
   case'call':await blog(e.name+'は 応援を よんだ！');if(Math.random()<.5){e.hp=Math.min(e.mhp,e.hp+30);return blog('警官が かけつけて キズの 手当てを した！')}return blog('しかし だれも こなかった……');
   case'wakiwave':await blog(e.name+'は ワキを 見せつけた！');await blog('ムワッ……！');return all(.7);
   case'smash':await blog(e.name+'は おおきく 足を ふりあげた！');if(await miss())return;return hitMember(e,t,1.6);
   case'double':await blog(e.name+'は 鼻緒の ように からみついた！');if(await miss())return;await hitMember(e,t,.75);return hitMember(e,t,.75,true);
   case'soup':await blog(e.name+'は アツアツの スープを ぶちまけた！');return all(.6);
   case'guruguru':await blog(e.name+'は ぐるぐる まわった！');return bindT('目が まわっている……','は 目を まわした！','しかし なにも おこらなかった。');
   case'wakiaura':await blog(e.name+'は ワキから あやしい オーラを はなった！');return all(.8);
   case'melt':await blog(e.name+'は 胃液を あびせてきた！');if(await miss())return;return hitMember(e,t,1.3);
   case'dance':await blog(e.name+'は ヘンポコおどりを おどった！');return blog('……とくに なにも おこらなかった。');
   case'kick':await blog(e.name+'の するどい けり！');if(await miss())return;return hitMember(e,t,1.5);
   case'wakikatame':await blog(e.name+'の ワキ固め！！');if(await miss())return;return hitMember(e,t,1.6);
  }
}
const CMD={left:'3%',bottom:'3%',width:'30%'};
const SUB={left:'35%',bottom:'3%',width:'62%'};
async function pickEnemy(){const l=liveEnemies();if(l.length===1)return l[0];const i=await choose(l.map(e=>e.name),{style:SUB,title:'だれを？'});return i<0?null:l[i]}
async function pickSkill(p){
  const i=await choose(p.skills.map(s=>({label:SKILLS[s].name,right:SKILLS[s].mp+'MP',disabled:p.mp<SKILLS[s].mp})),{style:SUB,title:'とくぎ'});if(i<0)return null;
  const key=p.skills[i],s=SKILLS[key];let t=null;
  if(s.tg==='enemy'){t=await pickEnemy();if(!t)return null}
  if(s.tg==='ally'){t=await pickAlly('だれに？',{style:SUB});if(!t)return null}
  return{type:'skill',actor:p,skill:key,target:t};
}
async function pickItem(p){
  const list=itemList(true);if(!list.length){await blog('なにも もっていない！',300);hideMsg();return null}
  const i=await choose(list.map(k=>({label:ITEMS[k].name,right:ITEMS[k].key?'':'×'+S.items[k]})),{style:SUB,title:'どうぐ'});if(i<0)return null;
  const id=list[i];let t=null;
  if(!ITEMS[id].key){t=await pickAlly('だれに？',{style:SUB});if(!t)return null}
  return{type:'item',actor:p,item:id,target:t};
}
async function inputCommands(){
  const alive=living();const acts=[];let i=0;hideMsg();
  while(i<alive.length){
    const p=alive[i];B.active=S.party.indexOf(p);updateBattleStatus();
    if(p.bind>0){acts[i]={type:'bound',actor:p};i++;continue}
    const c=await choose(['たたかう','とくぎ','どうぐ','ぼうぎょ','にげる'],{style:CMD,title:p.name});
    if(c<0){if(i>0)i--;continue}
    let a=null;
    if(c===0){const t=await pickEnemy();if(t)a={type:'atk',actor:p,target:t}}
    else if(c===1)a=await pickSkill(p);
    else if(c===2)a=await pickItem(p);
    else if(c===3)a={type:'guard',actor:p};
    else{B.active=-1;updateBattleStatus();return{run:true}}
    if(a){acts[i]=a;i++}
  }
  B.active=-1;updateBattleStatus();return{acts:acts.slice(0,alive.length)};
}
async function partyAct(a){
  const p=a.actor;
  switch(a.type){
   case'atk':await blog(p.name+'の こうげき！');return hitEnemy(p,a.target,1,true);
   case'guard':return blog(p.name+'は みを まもっている。');
   case'bound':p.bind=0;return blog(p.name+'は '+(p.bindMsg||'うごけない！'));
   case'skill':{const s=SKILLS[a.skill];if(p.mp<s.mp){await blog(p.name+'は '+s.name+'を つかおうとした！');return blog('しかし MPが たりない！')}
     p.mp-=s.mp;updateBattleStatus();
     if(s.tg==='ally'&&a.target.hp<=0){await blog(p.name+'の '+s.name+'！');return blog('しかし '+a.target.name+'は たおれている……')}
     return s.run(p,a.target)}
   case'item':return useItem(a.item,p,a.target,true);
  }
}
function battleEnd(){if(bStat){bStat.remove();bStat=null}hideMsg();bclear();S.party.forEach(p=>{p.bind=0;p.guard=false;p.taunt=false});B=null;mode='field'}
async function battle(ids,o={}){
  const cnt={},seen={};ids.forEach(id=>cnt[id]=(cnt[id]||0)+1);
  const ens=ids.map(id=>{const d=EN[id];let name=d.name;if(cnt[id]>1){seen[id]=seen[id]||0;name+='ABCD'[seen[id]++]}return{d,name,hp:d.hp,mhp:d.hp,atk:d.atk,def:d.def,agi:d.agi,blind:0}});
  sfx('enc');flash(.8);await wait(180);
  B={ens,bg:MAPS[S.map].bg,o,active:-1};mode='battle';bclear();
  bStat=partyWin({left:'3%',right:'3%',top:'3%'});
  await blog(ens.length===1?ens[0].name+'が あらわれた！':ens[0].d.name+'たちが あらわれた！',500);
  if(o.intro){await o.intro();bclear()}
  let result=null,turn=0;
  while(!result){
    turn++;
    const inp=await inputCommands();bclear();
    let acts=[];
    if(inp.run){
      await blog(S.party[0].name+'たちは にげだした！');
      if(o.noEscape){await blog('しかし にげられない！')}
      else if(Math.random()<.65){await blog('うまく にげきれた！',300);result='escape';break}
      else await blog('しかし まわりこまれて しまった！');
    }else acts=inp.acts;
    acts.forEach(a=>{if(a.type==='guard')a.actor.guard=true;if(a.type==='skill'&&SKILLS[a.skill].pre){a.actor.guard=true;a.actor.taunt=true}});
    const order=[...acts.map(a=>({a,agi:a.actor.agi})),...liveEnemies().map(e=>({e,agi:e.agi}))].map(x=>(x.k=x.agi*(.6+Math.random()*.6),x)).sort((a,b)=>b.k-a.k);
    for(const x of order){
      if(x.a){if(x.a.actor.hp<=0)continue;bclear();const r=await partyAct(x.a);if(typeof r==='string'){result=r;break}}
      else{if(x.e.hp<=0)continue;bclear();await enemyAct(x.e)}
      if(!liveEnemies().length){result='win';break}
      if(!living().length){result='lose';break}
    }
    S.party.forEach(p=>{p.guard=false;p.taunt=false});
    B.ens.forEach(e=>{if(e.blind>0)e.blind--});
    if(!result&&o.onTurnEnd){const r=await o.onTurnEnd(turn);if(r)result=r}
  }
  if(result==='win'){
    const exp=ens.reduce((s,e)=>s+e.d.exp,0),gold=ens.reduce((s,e)=>s+e.d.gold,0);
    bclear();sfx('win');await blog(ens.length>1?'まものたちを やっつけた！':ens[0].name+'を やっつけた！',600);
    if(exp>0){await blog('それぞれ '+exp+'ポイントの けいけんちを かくとく！',500)}
    if(gold>0){S.gold+=gold;await blog(gold+'ゴールドを 手に入れた！',500)}
    for(const p of living()){p.exp+=exp;while(p.exp>=nextExp(p.lv)){
      p.lv++;const g=MEMBERS[p.id].grow;p.mhp+=g.mhp;p.mmp+=g.mmp;p.atk+=g.atk;p.def+=g.def;p.agi+=g.agi;p.hp=Math.min(p.mhp,p.hp+g.mhp);p.mp=Math.min(p.mmp,p.mp+g.mmp);
      sfx('lvl');updateBattleStatus();bclear();await blog(p.name+'は レベル'+p.lv+'に あがった！',700);
      (MEMBERS[p.id].learn[p.lv]||[]).forEach(s=>p.skills.push(s));
      for(const s of MEMBERS[p.id].learn[p.lv]||[])await blog(p.name+'は '+SKILLS[s].name+'を おぼえた！',600);
    }}
    await waitKeyShort();
  }
  if(result==='lose'&&!o.loseOk){await blog('カイトたちは ぜんめつした……',900);battleEnd();await gameOver();return'lose'}
  battleEnd();
  return result;
}
function waitKeyShort(ms=1600){msgArrow.hidden=false;return new Promise(res=>{let t=0;const done=()=>{clearTimeout(t);popH(h);res()};const h={tap:true,onKey(k){if(k==='ok'||k==='cancel')done()}};t=setTimeout(done,ms);pushH(h)})}
async function gameOver(){
  await fadeTo(1,800);S.gold=Math.floor(S.gold/2);S.party.forEach(p=>{p.hp=p.mhp;p.mp=p.mmp});
  const r=S.respawn;S.map=r.map;S.x=r.x;S.y=r.y;S.dir='down';mv=null;
  await fadeTo(0,600);await say('……カイトは 目を さました。','所持金が 半分に なってしまった……');
}

  B.ens.forEach((e,i)=>{const w=sc[i]*16;let alpha=1,dy=0;
    if(e.dieT){alpha=1-(now-e.dieT)/450;if(alpha<=0){x+=w+18;return}}
    if(e.hurtT&&now-e.hurtT<320&&Math.floor((now-e.hurtT)/55)%2===0){x+=w+18;return}
    if(e.atkT&&now-e.atkT<260)dy=6*Math.sin((now-e.atkT)/260*Math.PI);
    g.save();g.globalAlpha=Math.max(0,alpha);g.imageSmoothingEnabled=false;
    if(e.d.key==='wakinini1'||e.d.key==='wakinini2'){g.shadowColor='#c06aff';g.shadowBlur=18+Math.sin(now*.006)*8}
    g.drawImage(enemySprite(e.d),Math.round(x),Math.round(222-w+dy),w,w);
    if(e.blind>0){g.globalAlpha=.5;g.fillStyle='#ddd';g.beginPath();g.arc(x+w*.3,222-w*.7,10,0,7);g.arc(x+w*.6,222-w*.8,13,0,7);g.fill()}
    g.restore();x+=w+18});
}
let lastT=performance.now();
function frame(now){
  const dt=Math.min(50,now-lastT);lastT=now;
  if(S&&(mode==='field'||mode==='battle'))S.playMs=(S.playMs||0)+dt;
  if(mode==='field'&&S){
    if(mv){mv.t+=dt/150;if(mv.t>=1){mv.t=1;finishStep()}}
    else if(!busy&&!H.length&&heldDir())tryMove(heldDir());
  }
  ctx.imageSmoothingEnabled=false;ctx.save();
  if(now<shakeUntil)ctx.translate(rand(-4,4),rand(-3,3));
  if(mode==='title')drawTitle(now);
  else if(mode==='battle'&&B)drawBattle(now);
  else if(mode==='field'&&S)drawField(now);
  else{ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH)}
  if(fx)fx.draw(ctx,now);
  ctx.restore();
  if(fade>0){ctx.fillStyle='rgba(0,0,0,'+fade+')';ctx.fillRect(0,0,CW,CH)}
  if(flashA>0){ctx.fillStyle='rgba(255,255,255,'+flashA+')';ctx.fillRect(0,0,CW,CH);flashA=Math.max(0,flashA-dt/250)}
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- input
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyZ:'ok',Enter:'ok',Space:'ok',KeyX:'cancel',Escape:'cancel',Backspace:'cancel',KeyC:'cancel'};
const heldList=[];const heldDir=()=>heldList[heldList.length-1];
function holdOn(k){if(!DIRV[k])return;const i=heldList.indexOf(k);if(i>=0)heldList.splice(i,1);heldList.push(k)}
function holdOff(k){const i=heldList.indexOf(k);if(i>=0)heldList.splice(i,1)}
function press(k){
  ac();
  if(H.length){H[H.length-1].onKey(k);return}
  if(mode==='field'&&S&&!busy&&!mv){if(k==='ok')runScript(interact);else if(k==='cancel')runScript(fieldMenu)}
}
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();holdOn(k);if(e.repeat&&!DIRV[k])return;if(e.repeat&&!H.length)return;press(k)});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)holdOff(k)});
addEventListener('blur',()=>{heldList.length=0});
document.querySelectorAll('#pad .pb').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}holdOn(k);press(k)});
  const up=()=>{b.classList.remove('on');holdOff(k)};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault())});
$('#screen').addEventListener('pointerdown',()=>{ac();const h=H[H.length-1];if(h&&h.tap)h.onKey('ok')});

// ---------------------------------------------------------------- title & boot
async function title(){
  mode='title';fade=0;
  const tb=el('div','titlebox');tb.innerHTML='<div class="sub">怪盗館長と</div><div class="main">幻の<b>サンダル</b></div><div class="cr">A SHORT RPG</div>';
  const has=!!loadGame();
  const c=await choose(['はじめから',{label:'つづきから',disabled:!has}],{style:{left:'50%',top:'58%',transform:'translateX(-50%)'},cancel:false,start:has?1:0});
  tb.remove();
  if(c===0){S=newState();applyAllFlags();busy=true;try{await opening()}finally{busy=false}}
  else{S=loadGame();applyAllFlags();mode='field';fade=1;await fadeTo(0,500);showMapName(MAPS[S.map].name)}
}
function boot(data){
  requestAnimationFrame(frame);
  if(data&&data.s){try{S=JSON.parse(data.s);applyAllFlags();mode='field';return}catch(e){S=null}}
  title();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({s:S&&mode==='field'&&!busy?JSON.stringify(S):null}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot(window.claude&&window.claude.hot&&window.claude.hot.data||{});
window.__g={get S(){return S},MAPS,MZ,battle,warpTo,setF,addMember,giveItem,F,get mode(){return mode},get busy(){return busy},H};
</script>
