<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>ライツ・オブ・ヒューマニティ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one pixel play screen centered on a dark "frying-oil" ground, thumb pad below on touch devices */
:root{
  --ink:#0d0a12;
  --panel:#191422;
  --line:#2e2640;
  --text:#efe7d6;
  --muted:#9b91ad;
  --oil:#f2b234;
  --oil-deep:#a8681a;
  --win:#000000;
  --win-line:#f6f1e4;
  --danger:#e8584a;
  --pixel:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic','MS Gothic',monospace;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--pixel);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding-inline:16px;padding-block:10px;box-sizing:border-box}
#bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);letter-spacing:.08em;box-sizing:border-box;max-width:100%}
#bar b{color:var(--oil);font-weight:400}
#snd{white-space:nowrap;flex:none;font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;letter-spacing:.06em}
#snd:focus-visible,#pad button:focus-visible{outline:2px solid var(--oil);outline-offset:2px}
#frame{position:relative;overflow:hidden;border:3px solid var(--line);border-radius:6px;background:#000;box-shadow:0 18px 44px -20px rgba(242,178,52,.45);flex:none}
#stage{position:absolute;left:0;top:0;width:512px;height:480px;transform-origin:0 0;overflow:hidden}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 2px);z-index:50}
#cv{display:block;width:512px;height:480px;image-rendering:crisp-edges;image-rendering:pixelated}

.win{position:absolute;box-sizing:border-box;background:var(--win);color:var(--win-line);border:3px solid var(--win-line);border-radius:10px;box-shadow:0 0 0 3px var(--win);padding:10px 16px;font-family:var(--pixel);font-size:21px;line-height:1.5;z-index:10}
#msg{left:12px;right:12px;bottom:12px;min-height:140px;white-space:pre-wrap;cursor:pointer}
#msg.narr{background:rgba(0,0,0,.62);border-color:transparent;box-shadow:none;text-align:center;bottom:22px}
#msg.big #msgText{font-size:30px;line-height:1.35;color:var(--oil)}
#msgName{color:var(--oil);font-size:18px;line-height:1.3;margin-bottom:2px}
#msgName:empty{display:none}
#msgArrow{position:absolute;left:50%;bottom:4px;font-size:16px;animation:blink .7s steps(1) infinite}
.menu{font-size:19px;line-height:1.55}
.wtitle{color:var(--oil);font-size:17px;line-height:1.4;border-bottom:2px solid #3a3a3a;margin-bottom:4px;padding-bottom:2px}
.opt{position:relative;padding-left:24px;cursor:pointer;display:flex;justify-content:space-between;gap:18px;white-space:nowrap}
.opt .r{font-variant-numeric:tabular-nums;color:#cfc8b8}
.opt.dim{color:#7c7668}
.opt.sel::before{content:"▶";position:absolute;left:0;top:0;animation:blink .8s steps(1) infinite}
#status{left:12px;right:12px;top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:18px;line-height:1.25;padding:6px 14px;font-variant-numeric:tabular-nums}
#status .pn{color:var(--win-line)}
#status .cur .pn{color:var(--oil)}
#status .low{color:#f0c040}
#status .dead{color:var(--danger)}
#status .hurt{animation:hurt .32s steps(2) 1}
.kv{display:grid;grid-template-columns:1fr auto;column-gap:22px;font-size:19px;line-height:1.5;font-variant-numeric:tabular-nums}
.gold{font-variant-numeric:tabular-nums}

#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:24px;z-index:5;cursor:pointer}
.t-kicker{font-size:15px;letter-spacing:.3em;color:#cbbfe6}
.t-main{margin:10px 0 6px;font-weight:400;font-size:44px;line-height:1.12;letter-spacing:.04em;color:var(--oil);text-wrap:balance;text-shadow:3px 0 0 #5a2a06,-3px 0 0 #5a2a06,0 3px 0 #5a2a06,0 -3px 0 #5a2a06,3px 3px 0 #5a2a06,0 6px 0 #2a1003}
.t-sub{font-size:19px;letter-spacing:.12em;color:var(--win-line)}
.t-press{margin-top:30px;font-size:18px;letter-spacing:.2em;animation:blink 1s steps(1) infinite}

#pad{display:none;justify-content:space-between;align-items:center;gap:16px;touch-action:none;box-sizing:border-box;width:100%;max-width:480px;padding-inline:4px}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px)}
#pad button{font-family:var(--pixel);font-size:20px;color:var(--text);background:var(--panel);border:2px solid var(--line);touch-action:none;cursor:pointer;padding:0}
#pad button.on{background:var(--oil-deep);border-color:var(--oil);color:#fff}
.dpad button{border-radius:8px}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.dpad .c{grid-column:2;grid-row:2;background:transparent;border:0}
.ab{display:flex;gap:16px;align-items:flex-start}
.ab button{width:68px;height:68px;border-radius:50%}
.ab .b{margin-top:30px}
.ab button span{display:block;font-size:11px;color:var(--muted);margin-top:-2px}
#keys{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;line-height:1.7;max-width:640px}
#keys kbd{font-family:var(--mono);color:var(--text);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;background:var(--panel)}
@media (hover:none),(pointer:coarse){ #pad{display:flex} #keys{display:none} }
@media (max-width:560px){ #bar .sub{display:none} }
@keyframes blink{50%{opacity:0}}
@keyframes hurt{50%{color:var(--danger);transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){ .opt.sel::before,#msgArrow,.t-press{animation:none} #status .hurt{animation:none} }
</style>
</head>
<body>
<div id="app">
  <header id="bar"><span><b>ライツ・オブ・ヒューマニティ</b><span class="sub">　〜油の泉と時代のしっぽ〜</span></span><button id="snd" type="button" aria-pressed="true">♪ おと ON</button></header>
  <div id="frame">
    <div id="stage">
      <canvas id="cv" width="256" height="240" aria-label="ゲーム画面"></canvas>
      <div id="title" hidden>
        <div class="t-kicker">セクラセ・トーユと なかまたちの ものがたり</div>
        <h1 class="t-main">ライツ・オブ・<br>ヒューマニティ</h1>
        <div class="t-sub">〜 油の泉と 時代のしっぽ 〜</div>
        <div class="t-press" id="tpress">PRESS　A ／ Z ／ TAP</div>
      </div>
      <div id="status" class="win" hidden></div>
      <div id="msg" class="win" hidden><div id="msgName"></div><div id="msgText"></div><div id="msgArrow" hidden>▼</div></div>
    </div>
  </div>
  <div id="pad" aria-label="コントローラー">
    <div class="dpad">
      <button class="u" data-k="U" type="button" aria-label="うえ">▲</button>
      <button class="l" data-k="L" type="button" aria-label="ひだり">◀</button>
      <span class="c"></span>
      <button class="r" data-k="R" type="button" aria-label="みぎ">▶</button>
      <button class="d" data-k="D" type="button" aria-label="した">▼</button>
    </div>
    <div class="ab">
      <button class="b" data-k="B" type="button">B<span>もどる</span></button>
      <button class="a" data-k="A" type="button">A<span>けってい</span></button>
    </div>
  </div>
  <p id="keys">いどう <kbd>↑↓←→</kbd>/<kbd>WASD</kbd>　けってい・はなす <kbd>Z</kbd>/<kbd>Enter</kbd>/<kbd>Space</kbd>　もどる・メニュー <kbd>X</kbd>/<kbd>Esc</kbd>　おと <kbd>M</kbd></p>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const stage=$('#stage'), frameEl=$('#frame');
const W=256,H=240,TS=16;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= SOUND ================= */
const NOTE={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nf(n){const m=/^([A-G]#?)(\d)$/.exec(n);return 440*Math.pow(2,((+m[2]+1)*12+NOTE[m[1]]-69)/12);}
const Snd={
  ctx:null,master:null,on:true,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      this.ctx=new AC(); this.master=this.ctx.createGain();
      this.master.gain.value=this.on?0.16:0; this.master.connect(this.ctx.destination);
    }catch(e){ this.ctx=null; }
    Music.kick();
  },
  setOn(v){ this.on=v; if(this.master) this.master.gain.value=v?0.16:0; },
  tone(f,dur,o={}){
    const c=this.ctx; if(!c) return;
    const t=(o.at!=null?o.at:c.currentTime)+(o.delay||0);
    const osc=c.createOscillator(), g=c.createGain();
    osc.type=o.type||'square'; osc.frequency.setValueAtTime(f,t);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    const v=o.vol==null?0.5:o.vol;
    g.gain.setValueAtTime(v,t); g.gain.setValueAtTime(v,t+dur*0.7); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t+dur+0.03);
  },
  noise(dur,o={}){
    const c=this.ctx; if(!c) return;
    const t=c.currentTime+(o.delay||0), n=Math.floor(c.sampleRate*dur);
    const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=buf;
    const g=c.createGain(); g.gain.setValueAtTime(o.vol||0.4,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(g); g.connect(this.master); s.start(t);
  },
  seq(notes,step,o={}){ notes.forEach((n,i)=>{ if(n) this.tone(nf(n),step*(o.len||1),{...o,delay:i*step}); }); },
  sfx(k){
    if(!this.ctx) return;
    switch(k){
      case 'blip': this.tone(1100,0.025,{vol:0.1}); break;
      case 'cursor': this.tone(880,0.04,{vol:0.22}); break;
      case 'ok': this.tone(1320,0.05,{vol:0.22}); this.tone(1760,0.06,{vol:0.18,delay:0.04}); break;
      case 'cancel': this.tone(520,0.07,{vol:0.22}); break;
      case 'hit': this.noise(0.12,{vol:0.5}); this.tone(240,0.1,{to:80,vol:0.35}); break;
      case 'hurt': this.noise(0.25,{vol:0.6}); this.tone(170,0.2,{to:60,vol:0.35,type:'sawtooth'}); break;
      case 'kill': this.tone(700,0.3,{to:60,vol:0.3}); break;
      case 'magic': this.seq(['C6','E6','G6','C7','G6','C7'],0.05,{vol:0.22}); break;
      case 'heal': this.seq(['C5','E5','G5','C6','E6'],0.07,{vol:0.3,type:'triangle'}); break;
      case 'skill': this.tone(300,0.15,{to:900,vol:0.28}); break;
      case 'encounter': this.seq(['C5','C#5','D5','D#5','E5','F5','F#5','G5'],0.035,{vol:0.28}); break;
      case 'lvup': this.seq(['G5','A5','B5','D6',null,'B5','D6','G6'],0.08,{vol:0.28}); break;
      case 'join': this.seq(['C5','E5','G5','C6',null,'A5','C6','E6'],0.09,{vol:0.28}); break;
      case 'win': this.seq(['C5','C5','C5','C5',null,'G#4',null,'A#4',null,'C5','A#4','C5'],0.09,{vol:0.28}); break;
      case 'inn': this.seq(['E5','G5','C6',null,'B5','G5','C6'],0.2,{vol:0.28,type:'triangle',len:1.4}); break;
      case 'door': this.tone(392,0.05,{vol:0.25}); this.tone(262,0.08,{delay:0.05,vol:0.25}); break;
      case 'run': this.seq(['C6','A5','F5','D5'],0.05,{vol:0.25}); break;
      case 'item': this.seq(['E6','G6','C7'],0.06,{vol:0.22}); break;
      case 'buy': this.tone(988,0.06,{vol:0.25}); this.tone(1319,0.25,{delay:0.06,vol:0.25}); break;
      case 'alarm': for(let i=0;i<4;i++){ this.tone(880,0.14,{delay:i*0.3,vol:0.32}); this.tone(660,0.14,{delay:i*0.3+0.15,vol:0.32}); } break;
      case 'nyoki': for(let i=0;i<10;i++) this.tone(160+i*50,0.1,{to:320+i*70,delay:i*0.1,type:'sawtooth',vol:0.26}); break;
      case 'splash': this.noise(0.6,{vol:0.4}); this.tone(800,0.3,{to:120,vol:0.22}); break;
      case 'tererein': {
        const s=0.11;
        [['E5',0,s],['G5',s,s],['B5',2*s,s],['E6',3*s,0.95]].forEach(([n,d,l])=>this.tone(nf(n),l,{delay:d,vol:0.36}));
        [['B4',0,s],['E5',s,s],['G#5',2*s,s],['B5',3*s,0.95]].forEach(([n,d,l])=>this.tone(nf(n),l,{delay:d,vol:0.2}));
        this.tone(nf('E3'),1.2,{delay:3*s,type:'triangle',vol:0.5});
        break; }
    }
  }
};
function parseTrack(s){
  const ev=[]; let last=null;
  for(const t of s.trim().split(/\s+/)){
    if(t==='-'){ if(last) last.len++; ev.push(null); }
    else if(t==='.'){ last=null; ev.push(null); }
    else { last={f:nf(t),len:1}; ev.push(last); }
  }
  return ev;
}
const SONGS={
  title:{bpm:100,tracks:[
    {type:'square',vol:0.1,n:'E5 - - B4 E5 - G5 -  F#5 - E5 - D#5 - B4 -  C5 - - G4 C5 - E5 -  D5 - C5 - B4 - - -'},
    {type:'triangle',vol:0.3,n:'E3 - B2 - E3 - B2 -  B2 - F#2 - B2 - F#2 -  A2 - E2 - A2 - E2 -  G2 - D2 - G2 - B2 -'}]},
  field:{bpm:132,tracks:[
    {type:'square',vol:0.09,n:'C5 - E5 G5 - - E5 -  F5 - A5 C6 - - A5 -  G5 - E5 C5 - - D5 E5  D5 - - - . . . .  C5 - E5 G5 - - C6 -  B5 - A5 G5 - - F5 E5  F5 - A5 G5 - - D5 -  C5 - - - . . . .'},
    {type:'triangle',vol:0.3,n:'C3 . G3 . C3 . G3 .  F3 . C4 . F3 . C4 .  E3 . G3 . E3 . G3 .  G2 . D3 . G2 . B2 .  C3 . G3 . C3 . G3 .  G2 . D3 . E3 . B2 .  F2 . C3 . G2 . D3 .  C3 . G3 . C3 . . .'}]},
  town:{bpm:150,tracks:[
    {type:'square',vol:0.09,n:'F5 A5 C6 A5 F5 . G5 .  A5 G5 F5 E5 F5 - - .  D5 F5 A5 F5 D5 . E5 .  F5 E5 D5 C5 C5 - - .'},
    {type:'triangle',vol:0.3,n:'F3 . C3 . F3 . C3 .  A#2 . F3 . A#2 . F3 .  D3 . A3 . D3 . A3 .  C3 . G3 . C3 . E3 .'}]},
  castle:{bpm:120,tracks:[
    {type:'square',vol:0.09,n:'G4 . G4 . B4 . D5 .  G5 - - . F#5 . E5 .  D5 . C5 . B4 . A4 .  G4 - A4 - B4 - - .'},
    {type:'triangle',vol:0.3,n:'G2 . D3 . G2 . D3 .  C3 . G3 . C3 . G3 .  D3 . A3 . D3 . A3 .  G2 . D3 . G2 - - .'}]},
  demon:{bpm:110,tracks:[
    {type:'square',vol:0.09,n:'E4 - - G4 F#4 - - D#4  E4 - - B3 C4 - B3 -  E4 - - G4 A4 - G4 F#4  G4 - F#4 - D#4 - - -'},
    {type:'triangle',vol:0.34,n:'E2 - - - E2 - - -  C2 - - - B1 - - -  E2 - - - A1 - - -  B1 - - - B1 - - -'}]},
  battle:{bpm:176,tracks:[
    {type:'square',vol:0.09,n:'A4 C5 E5 A5 G5 E5 C5 E5  F5 A5 C6 A5 G5 E5 D5 E5  A4 C5 E5 A5 B5 A5 G#5 E5  F5 - E5 - D5 - E5 -'},
    {type:'triangle',vol:0.3,n:'A2 A3 A2 A3 A2 A3 A2 A3  F2 F3 F2 F3 G2 G3 G2 G3  A2 A3 A2 A3 A2 A3 A2 A3  D3 D3 D3 D3 E3 E3 E3 E3'}]},
  boss:{bpm:184,tracks:[
    {type:'square',vol:0.1,n:'E5 . E5 F5 E5 . D5 .  C5 . D5 E5 B4 - - -  E5 . E5 F5 G5 . F5 .  E5 . D5 C5 D#5 - - -'},
    {type:'triangle',vol:0.32,n:'E2 E3 E2 E3 E2 E3 E2 E3  C3 C4 C3 C4 B2 B3 B2 B3  E2 E3 E2 E3 E2 E3 E2 E3  A2 A3 A2 A3 B2 B3 B2 B3'}]},
  ending:{bpm:96,tracks:[
    {type:'square',vol:0.09,n:'C5 - E5 - G5 - C6 -  B5 - G5 - A5 - - -  F5 - A5 - C6 - A5 -  G5 - - - E5 - D5 -  C5 - E5 - G5 - C6 -  D6 - C6 - B5 - A5 -  G5 - F5 - E5 - D5 -  C5 - - - - - . .'},
    {type:'triangle',vol:0.3,n:'C3 - G3 - E3 - G3 -  G2 - D3 - F3 - - -  F2 - C3 - A2 - C3 -  G2 - D3 - G2 - B2 -  A2 - E3 - C3 - E3 -  F2 - C3 - D3 - F3 -  G2 - D3 - G2 - B2 -  C3 - G2 - C3 - - -'}]},
};
const Music={
  cur:null,timer:null,step:0,next:0,parsed:null,stepDur:0.2,
  play(name){
    if(this.cur===name) return;
    this.stop(); this.cur=name;
    if(!name||!SONGS[name]) return;
    const s=SONGS[name];
    this.parsed=s.tracks.map(t=>({...t,ev:parseTrack(t.n)}));
    this.stepDur=60/s.bpm/2; this.step=0;
    this.kick();
  },
  kick(){
    if(!Snd.ctx||!this.cur||this.timer||!this.parsed) return;
    this.next=Snd.ctx.currentTime+0.06;
    this.timer=setInterval(()=>this.tick(),40);
  },
  stop(){ clearInterval(this.timer); this.timer=null; this.cur=null; this.parsed=null; },
  tick(){
    const c=Snd.ctx; if(!c||!this.parsed) return;
    if(this.next<c.currentTime) this.next=c.currentTime+0.05;
    while(this.next<c.currentTime+0.16){
      for(const t of this.parsed){
        const e=t.ev[this.step%t.ev.length];
        if(e) Snd.tone(e.f,e.len*this.stepDur*0.9,{at:this.next,type:t.type,vol:t.vol});
      }
      this.step++; this.next+=this.stepDur;
    }
  }
};

const sprCache={};
function getSpr(key,back){
  const ck=key+(back?'_b':'');
  if(sprCache[ck]) return sprCache[ck];
  const d=SPR[key];
  let rows=TPL[d.t];
  if(back&&d.t==='human'){ rows=rows.slice(); for(let i=0;i<4;i++) rows[4+i]=BACK_ROWS[i]; }
  const pal=Object.assign({},DEFPAL[d.t]||{},d.p);
  const c=document.createElement('canvas'); c.width=16; c.height=16;
  const g=c.getContext('2d');
  rows.forEach((r,y)=>{ for(let x=0;x<16;x++){ const ch=r[x]; if(ch==='.'||!pal[ch]) continue; g.fillStyle=pal[ch]; g.fillRect(x,y,1,1); } });
  (d.x||[]).forEach(([x,y,col,f])=>{ if(back&&f) return; g.fillStyle=col; g.fillRect(x,y,1,1); });
  sprCache[ck]=c; return c;
}
function drawSpr(key,x,y,o={}){
  const c=getSpr(key,o.back), s=o.scale||1;
  ctx.save();
  if(o.alpha!=null) ctx.globalAlpha=Math.max(0,o.alpha);
  if(o.flip){ ctx.translate(x+16*s,y); ctx.scale(-1,1); ctx.drawImage(c,0,0,16*s,16*s); }
  else ctx.drawImage(c,x,y,16*s,16*s);
  ctx.restore();
}

function needExp(lv){ return Math.round(10*Math.pow(lv-1,2.2)); }
function stats(m){
  const c=CHARS[m.id], L=m.lv-1, s={};
  for(const k of ['hp','mp','atk','def','spd','mag']) s[k]=Math.floor(c.base[k]+c.grow[k]*L);
  if(m.id==='toyu'&&G.flags.tail){ s.hp+=25; s.atk+=8; s.def+=4; s.spd+=3; }
  return {mhp:s.hp,mmp:s.mp,atk:s.atk,def:s.def,spd:s.spd,mag:s.mag};
}
function mkMember(id,lv){ const m={id,lv,exp:needExp(lv),hp:0,mp:0,buff:1,guard:false}; const s=stats(m); m.hp=s.mhp; m.mp=s.mmp; return m; }
const nm=m=>CHARS[m.id].name;
const hasMember=id=>G.party.some(m=>m.id===id);
const sprOf=m=>(m.id==='toyu'&&G.flags.tail)?'toyuT':m.id;
function skillsOf(m){ return LEARN[m.id].filter(l=>m.lv>=l.lv&&(!l.flag||G.flags[l.flag])).map(l=>({id:l.id,...SKILLS[l.id]})); }
function healAll(){ G.party.forEach(m=>{ const s=stats(m); m.hp=s.mhp; m.mp=s.mmp; }); }

const msgEl=$('#msg'), msgName=$('#msgName'), msgText=$('#msgText'), msgArrow=$('#msgArrow'), statusEl=$('#status'), titleEl=$('#title');
function msgShow(){ msgEl.hidden=false; }
function msgHide(){ msgEl.hidden=true; msgText.textContent=''; msgName.textContent=''; }
function say(text,o={}){
  return new Promise(res=>{
    msgShow();
    msgEl.classList.toggle('narr',!!o.narr);
    msgEl.classList.toggle('big',!!o.big);
    msgName.textContent=o.name||'';
    msgArrow.hidden=true;
    const chars=[...text]; let i=0, state='typing';
    const draw=()=>{ msgText.textContent=chars.slice(0,i).join(''); };
    const done=()=>{ if(state==='done') return; state='done'; msgArrow.hidden=true; if(ui.handler===h) ui.handler=null; res(); };
    const endType=()=>{ if(state!=='typing') return; clearInterval(timer); i=chars.length; draw(); state='wait'; if(o.auto) setTimeout(done,o.auto); else msgArrow.hidden=false; };
    const timer=setInterval(()=>{ i++; draw(); if(!o.auto&&i%3===0&&chars[i-1]!==' ') Snd.sfx('blip'); if(i>=chars.length) endType(); },o.auto?11:24);
    const h=k=>{ if(k!=='A'&&k!=='B') return; if(state==='typing') endType(); else if(state==='wait'){ if(!o.auto) Snd.sfx('ok'); done(); } };
    ui.handler=h; draw();
  });
}
async function T(name,...lines){ for(const l of lines) await say(l,{name}); }
const bsay=(t,ms=650)=>say(t,{auto:ms});
async function quickMsg(t){ await say(t,{auto:800}); msgHide(); }
function mkWin(cls,style){ const d=document.createElement('div'); d.className='win '+(cls||''); Object.assign(d.style,style||{}); stage.appendChild(d); return d; }
function choose(items,o={}){
  return new Promise(res=>{
    const w=mkWin('menu',o.style||{left:'12px',bottom:'12px',minWidth:'200px'});
    if(o.title){ const t=document.createElement('div'); t.className='wtitle'; t.textContent=o.title; w.appendChild(t); }
    let idx=Math.min(o.start||0,items.length-1);
    const close=()=>{ w.remove(); if(ui.handler===h) ui.handler=null; };
    const pickIt=()=>{ Snd.sfx('ok'); close(); res(idx); };
    const els=items.map((it,i)=>{
      const e=document.createElement('div'); e.className='opt';
      const label=typeof it==='object'?it.label:it;
      const a=document.createElement('span'); a.textContent=label; e.appendChild(a);
      if(typeof it==='object'&&it.right!=null){ const b=document.createElement('span'); b.className='r'; b.textContent=it.right; e.appendChild(b); }
      if(typeof it==='object'&&it.dim) e.classList.add('dim');
      e.addEventListener('pointerdown',ev=>{ ev.preventDefault(); ev.stopPropagation(); Snd.init(); idx=i; draw(); pickIt(); });
      w.appendChild(e); return e;
    });
    const draw=()=>els.forEach((e,i)=>e.classList.toggle('sel',i===idx));
    draw();
    const h=k=>{
      if(k==='U'){ idx=(idx+items.length-1)%items.length; Snd.sfx('cursor'); draw(); }
      else if(k==='D'){ idx=(idx+1)%items.length; Snd.sfx('cursor'); draw(); }
      else if(k==='A') pickIt();
      else if(k==='B'&&o.cancel!==false){ Snd.sfx('cancel'); close(); res(-1); }
    };
    ui.handler=h;
  });
}
function waitKey(keys){ return new Promise(res=>{ const h=k=>{ if(keys.includes(k)){ if(ui.handler===h) ui.handler=null; res(k); } }; ui.handler=h; }); }
async function chooseMember(pool,style){
  const i=await choose(pool.map(m=>({label:nm(m),right:'H'+m.hp})),{title:'だれに？',style:style||{left:'200px',top:'128px',minWidth:'210px'}});
  return i<0?null:pool[i];
}
function statusShow(v){ statusEl.hidden=!v; if(v) statusUpdate(); }
function statusUpdate(){
  if(statusEl.hidden) return;
  const now=performance.now();
  statusEl.innerHTML=G.party.map(m=>{
    const s=stats(m);
    const cls=[m.hp<=0?'dead':(m.hp<=s.mhp/4?'low':''),(B&&B.cur===m)?'cur':'',(m._hurt&&now-m._hurt<330)?'hurt':''].join(' ');
    return `<div class="${cls}"><div class="pn">${nm(m)}</div><div>H ${m.hp}</div><div>M ${m.mp}</div><div>Lv ${m.lv}</div></div>`;
  }).join('');
}
function goldWin(style){
  const w=mkWin('gold',style||{right:'12px',top:'128px',minWidth:'130px'});
  w.update=()=>{ w.textContent=G.gold+' G'; };
  w.update(); return w;
}

const KEYMAP={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R',W:'U',S:'D',A:'L',D:'R',z:'A',Z:'A',Enter:'A',' ':'A',x:'B',X:'B',Escape:'B',Backspace:'B'};
function press(k){
  Snd.init();
  if(ui.handler) ui.handler(k);
  else if(G.scene==='map'&&!busy&&!G.moving) mapPress(k);
}
window.addEventListener('keydown',e=>{
  if(e.key==='m'||e.key==='M'){ toggleSound(); return; }
  const k=KEYMAP[e.key]; if(!k) return;
  e.preventDefault();
  if(k in held) held[k]=1;
  if(e.repeat&&(k==='A'||k==='B')) return;
  press(k);
});
window.addEventListener('keyup',e=>{ const k=KEYMAP[e.key]; if(k&&k in held) held[k]=0; });
window.addEventListener('blur',()=>{ for(const k in held) held[k]=0; });
document.querySelectorAll('#pad [data-k]').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{ e.preventDefault(); b.classList.add('on'); if(k in held) held[k]=1; press(k); };
  const up=()=>{ b.classList.remove('on'); if(k in held) held[k]=0; };
  b.addEventListener('pointerdown',down);
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
msgEl.addEventListener('pointerdown',e=>{ e.preventDefault(); press('A'); });
titleEl.addEventListener('pointerdown',e=>{ if(e.target.closest('.opt')) return; e.preventDefault(); press('A'); });
const sndBtn=$('#snd');
function toggleSound(){ Snd.init(); Snd.setOn(!Snd.on); sndBtn.textContent=Snd.on?'♪ おと ON':'♪ おと OFF'; sndBtn.setAttribute('aria-pressed',String(Snd.on)); }

/* ================= LAYOUT ================= */
function fit(){
  const pad=$('#pad'), keys=$('#keys'), bar=$('#bar');
  const padH=pad.offsetParent?pad.offsetHeight+10:0;
  const keysH=keys.offsetParent?keys.offsetHeight+10:0;
  const availW=Math.min(document.documentElement.clientWidth-32-6,768);
  const availH=window.innerHeight-padH-keysH-bar.offsetHeight-10-20-6;
  const w=Math.max(220,Math.floor(Math.min(availW,availH*512/480)));
  frameEl.style.width=w+'px'; frameEl.style.height=Math.round(w*480/512)+'px';
  stage.style.transform=`scale(${w/512})`;
  bar.style.width=(w+6)+'px';
}
window.addEventListener('resize',fit);

function fade(to,ms=260){
  return new Promise(res=>{
    const from=G.fade, t0=performance.now();
    const step=()=>{ const k=Math.min(1,(performance.now()-t0)/ms); G.fade=from+(to-from)*k; if(k<1) setTimeout(step,16); else res(); };
    step();
  });
}
async function flashScreen(color,times=2){
  for(let i=0;i<times;i++){ G.flashColor=color; G.flash=REDUCE?0.35:0.85; await sleep(70); G.flash=0; await sleep(70); }
}
function shake(n){ if(!REDUCE) G.shake=Math.max(G.shake,n); }

function tileAt(x,y){ const m=G.map; if(!m||y<0||y>=m.h||x<0||x>=m.w) return null; return m.rows[y][x]; }
function npcsOf(){ return (G.map&&G.map.npcs||[]).filter(n=>!n.show||n.show()); }

async function run(fn){

}
function mapPress(k){
  if(k==='A'){
    const [dx,dy]=DIRS[G.dir]; let fx=G.px+dx, fy=G.py+dy;
    if(tileAt(fx,fy)==='q'){ fx+=dx; fy+=dy; }
    const n=npcsOf().find(n=>n.x===fx&&n.y===fy);
    if(n&&n.talk) run(n.talk);
  } else if(k==='B') run(fieldMenu);
}
function onStep(){
  const m=G.map, t=tileAt(G.px,G.py);
  const ex=(m.exits||[]).find(e=>e.x===G.px&&e.y===G.py);
  if(ex){ run(ex.go); return; }
  if(m.onTile){ const f=m.onTile(t,G.px,G.py); if(f){ run(f); return; } }
  if(m.enc){
    G.enc-=(t===','||t==='=')?0.5:1;
    if(G.enc<=0){ G.enc=rnd(11,20); const tb=TABLES[m.enc(G.px,G.py)]; run(()=>battle(pick(tb))); }
  }
}

function applyItem(it,ts){
  return ts.map(m=>{
    const s=stats(m);
    if(it.revive){ if(m.hp>0) return `${nm(m)}には こうかが なかった。`; m.hp=Math.ceil(s.mhp*it.revive); return `${nm(m)}は いきかえった！`; }
    if(it.heal){ const b=m.hp; m.hp=Math.min(s.mhp,m.hp+it.heal); return `${nm(m)}の HPが ${m.hp-b} かいふくした！`; }
    if(it.mp){ const b=m.mp; m.mp=Math.min(s.mmp,m.mp+it.mp); return `${nm(m)}の MPが ${m.mp-b} かいふくした！`; }
    return '';
  });
}

function layoutEnemies(){
  const es=B.enemies, gap=8;
  const tot=es.reduce((a,e)=>a+16*e.s,0)+gap*(es.length-1);
  let x=Math.round((W-tot)/2);
  for(const e of es){ e.x=x; e.y=150-16*e.s; x+=16*e.s+gap; }
}
function areaBg(){ return G.map?G.map.bg:'field'; }

async function battle(ids,o={}){
  if(G.scene==='map') Snd.sfx('encounter');
  Music.play(o.boss?'boss':'battle');
  await flashScreen('#ffffff',3);
  const counts={}, seen={};
  ids.forEach(id=>counts[id]=(counts[id]||0)+1);
  const enemies=ids.map(id=>{
    const d=ENEMIES[id]; let name=d.name;
    if(counts[id]>1){ seen[id]=(seen[id]||0)+1; name+='ABCD'[seen[id]-1]; }
    return {id,d,name,hp:d.hp,mhp:d.hp,atk:d.atk,def:d.def,spd:d.spd,buff:1,flash:0,alpha:1,dying:false,s:d.scale||3};
  });
  B={enemies,bg:o.bg||areaBg(),cur:null};
  layoutEnemies();
  G.scene='battle';
  G.party.forEach(m=>{ m.buff=1; m.guard=false; });
  statusShow(true);
  const first=enemies[0];
  if(o.boss) await bsay(enemies.map(e=>e.name).join('と ')+'が\nたちはだかった！',1000);
  else if(enemies.every(e=>e.id===first.id)) await bsay(`${first.d.name}${enemies.length>1?'たち':''}が あらわれた！`,900);
  else await bsay('てきの むれが あらわれた！',900);

  let round=0, result=null;
  while(!result){
    round++;
    if(!o.boss&&G.flags.yoki&&round>=2&&Math.random()<0.08) await nikiCameo();
    const cmd=await commandPhase(o);
    let acts=cmd.acts||new Map();
    if(cmd.run){
      if(o.noRun){ await bsay('にげられない！'); }
      else {
        await bsay(`${nm(G.party[0])}たちは にげだした！`);
        if(Math.random()<0.65){ Snd.sfx('run'); result='run'; break; }
        await bsay('しかし まわりこまれてしまった！');
      }
      acts=new Map();
    }
    for(const [m,a] of acts) if(a.type==='guard') m.guard=true;
    const order=[];
    for(const [m,a] of acts) order.push({p:m,a,s:stats(m).spd*(0.75+Math.random()*0.5)});
    for(const e of aliveEnemies()) order.push({e,s:e.spd*(0.75+Math.random()*0.5)});
    order.sort((a,b)=>b.s-a.s);
    for(const ac of order){
      if(!aliveEnemies().length||!aliveParty().length) break;
      if(ac.p){ if(ac.p.hp>0) await doPartyAct(ac.p,ac.a); }
      else if(ac.e.hp>0) await doEnemyAct(ac.e);
    }
    G.party.forEach(m=>m.guard=false);
    if(!aliveEnemies().length) result='win';
    else if(!aliveParty().length) result='lose';
  }

  if(result==='win'){
    Music.stop(); Snd.sfx('win');
    const exp=enemies.reduce((a,e)=>a+e.d.exp,0), gold=enemies.reduce((a,e)=>a+e.d.gold,0);
    await bsay(o.boss?`${enemies.map(e=>e.name).join('と ')}を やっつけた！`:'てきを やっつけた！',1000);
    G.party.forEach(m=>{ if(m.hp<=0) m.hp=1; });
    statusUpdate();
    if(exp) await bsay(`それぞれ ${exp}ポイントの けいけんちを かくとく！`,1000);
    if(gold){ G.gold+=gold; await bsay(`${gold}ゴールドを てにいれた！`,900); }
    await gainExp(exp);
  }
  if(result==='lose'){
    Music.stop();
    await bsay('ぜんめつ してしまった……',1600);
  }
  endBattle();
  if(result==='lose'){
    healAll(); G.gold=Math.floor(G.gold/2);
    const h=G.heal;
    await goto(h.map,h.x,h.y,'D',{skipEnter:true});
    await say('……きがつくと、 さいごに やすんだ 場所に いた。\n（もちきんが はんぶんに なった）');
    msgHide();
    if(G.map.onEnter) await G.map.onEnter();
  } else {
    if(G.map) Music.play(G.map.bgm);
    save();
  }
  return result;
}
function endBattle(){
  stage.querySelectorAll('.menu').forEach(e=>e.remove());
  statusShow(false); msgHide();
  G.party.forEach(m=>{ m.buff=1; m.guard=false; });
  B=null; G.scene='map';
}

  await bsay('とにかく沖縄に行きたいニキが とおりかかった！',1000);

function showEnemyList(){

async function pickEnemy(){
  const al=aliveEnemies();
  if(al.length===1) return al[0];
  const i=await choose(al.map(e=>e.name),{title:'だれを？',style:SUB_STYLE});
  return i<0?null:al[i];
}
async function commandPhase(o){
  msgHide();
  const alive=aliveParty(), acts=new Map();
  let i=0;
  while(i<alive.length){
    const m=alive[i]; B.cur=m; statusUpdate();
    const a=await pickAction(m,i);
    if(a==='back'){ i=Math.max(0,i-1); continue; }
    if(a.type==='run'){ B.cur=null; statusUpdate(); return {run:true}; }
    acts.set(m,a); i++;
  }
  B.cur=null; statusUpdate();
  return {acts};
}
async function pickAction(m,idx){
  while(true){
    const list=showEnemyList();
    const c=await choose(['たたかう','とくぎ','どうぐ','ぼうぎょ','にげる'],{title:nm(m),style:CMD_STYLE,cancel:idx>0,start:m._lastCmd||0});
    list.remove();
    if(c<0) return 'back';
    m._lastCmd=c;
    if(c===0){ const t=await pickEnemy(); if(!t) continue; return {type:'atk',target:t}; }
    if(c===1){
      const sk=skillsOf(m);
      const i=await choose(sk.map(s=>({label:s.name,right:s.mp,dim:m.mp<s.mp})),{title:`とくぎ　MP ${m.mp}`,style:SUB_STYLE});
      if(i<0) continue;
      const s=sk[i];
      if(m.mp<s.mp){ await quickMsg('MPが たりない！'); continue; }
      let target=null;
      if(s.target==='enemy'){ target=await pickEnemy(); if(!target) continue; }
      else if(s.target==='ally'){ target=await chooseMember(aliveParty(),SUB_STYLE); if(!target) continue; }
      return {type:'skill',skill:s.id,target};
    }
    if(c===2){
      const ids=Object.keys(G.inv).filter(k=>G.inv[k]>0);
      if(!ids.length){ await quickMsg('どうぐを もっていない！'); continue; }
      const i=await choose(ids.map(id=>({label:ITEMS[id].name,right:'×'+G.inv[id]})),{title:'どうぐ',style:SUB_STYLE});
      if(i<0) continue;
      const it=ITEMS[ids[i]]; let target=null;
      if(it.target!=='allies'){
        const pool=it.revive?G.party.filter(p=>p.hp<=0):aliveParty();
        if(!pool.length){ await quickMsg('つかう あいてが いない！'); continue; }
        target=await chooseMember(pool,SUB_STYLE); if(!target) continue;
      }
      return {type:'item',item:ids[i],target};
    }
    if(c===3) return {type:'guard'};
    return {type:'run'};
  }
}
function retarget(t){ if(t&&t.hp>0) return t; const al=aliveEnemies(); return al.length?pick(al):null; }
async function hitEnemy(t,dmg){
  t.hp=Math.max(0,t.hp-dmg); t.flash=18; Snd.sfx('hit');
  await bsay(`${t.name}に ${dmg}の ダメージ！`,520);
  if(t.hp<=0){ t.dying=true; Snd.sfx('kill'); await bsay(`${t.name}を たおした！`,560); }
}
async function hitMember(m,d){
  if(m.guard) d=Math.max(1,Math.ceil(d/2));
  m.hp=Math.max(0,m.hp-d); m._hurt=performance.now(); shake(10); Snd.sfx('hurt');
  statusUpdate(); setTimeout(statusUpdate,340);
  await bsay(`${nm(m)}は ${d}の ダメージを うけた！`,520);
  if(m.hp<=0){ statusUpdate(); await bsay(`${nm(m)}は たおれてしまった……`,800); }
}
async function doPartyAct(m,a){
  const st=stats(m);
  if(a.type==='guard'){ await bsay(`${nm(m)}は みを まもっている。`,500); return; }
  if(a.type==='atk'){
    const t=retarget(a.target); if(!t) return;
    await bsay(`${nm(m)}の こうげき！`,450);
    if(Math.random()<0.04){ await bsay(`ミス！ ${t.name}に ダメージを あたえられない！`); return; }
    await hitEnemy(t,physDmg(st.atk*m.buff,t.def,1));
    return;
  }
  if(a.type==='skill'){
    const s=SKILLS[a.skill];
    if(m.mp<s.mp){ await bsay(`${nm(m)}は ${s.name}を つかおうとした！\nしかし MPが たりない！`); return; }
    m.mp-=s.mp; statusUpdate();
    Snd.sfx(s.sfx||'skill');
    await bsay(s.msg.replace('{n}',nm(m)),850);
    if(s.kind==='buff'){ const t=(a.target&&a.target.hp>0)?a.target:m; t.buff=1.5; await bsay(`${nm(t)}の こうげき力が あがった！`); return; }
    if(s.kind==='heal'){ const amt=Math.round(st.mag*s.pow[0]+s.pow[1]); aliveParty().forEach(t=>{ t.hp=Math.min(stats(t).mhp,t.hp+amt); }); statusUpdate(); await bsay(`みんなの HPが ${amt}ほど かいふくした！`); return; }
    const targets=s.target==='enemies'?aliveEnemies():[retarget(a.target)].filter(Boolean);
    for(const t of targets){
      if(t.hp<=0) continue;
      const dmg=s.kind==='mag'?magDmg(st.mag,s.pow,t.def):physDmg(st.atk*m.buff,t.def,s.mult);
      await hitEnemy(t,dmg);
    }
    return;
  }
  if(a.type==='item'){
    const it=ITEMS[a.item];
    if(!G.inv[a.item]){ await bsay(`${nm(m)}は どうぐを さがしたが、 もう なかった！`); return; }
    G.inv[a.item]--;
    await bsay(`${nm(m)}は ${it.name}を つかった！`,600);
    const ts=it.target==='allies'?aliveParty():[a.target];
    Snd.sfx('heal');
    const lines=applyItem(it,ts); statusUpdate();
    for(const l of lines) await bsay(l,650);
  }
}
async function doEnemyAct(e){
  const alive=aliveParty(); if(!alive.length) return;
  const act=pickW(e.d.acts);
  if(act==='atk'){
    const t=pick(alive);
    await bsay(`${e.name}の こうげき！`,450);
    if(Math.random()<0.05){ await bsay(`ミス！ ${nm(t)}は ひらりと みをかわした！`); return; }
    await hitMember(t,physDmg(e.atk*e.buff,stats(t).def,1));
    return;
  }
  const s=ESK[act];
  if(s.sfx) Snd.sfx(s.sfx);
  if(act==='tererein') await flashScreen('#f2b234',1);
  await bsay(s.msg.replace(/\{n\}/g,e.name),900);
  if(s.type==='one'){
    let t=pick(alive);
    if(s.toyu){ const ty=alive.find(m=>m.id==='toyu'); if(ty) t=ty; }
    await hitMember(t,physDmg(e.atk*e.buff,stats(t).def,s.mult));
  } else if(s.type==='all'){
    for(const t of alive){ if(t.hp<=0) continue; const d=Math.max(1,Math.round((s.pow+e.atk*e.buff*0.35-stats(t).def*0.3)*(0.85+Math.random()*0.3))); await hitMember(t,d); }
  } else if(s.type==='selfheal'){
    const b=e.hp; e.hp=Math.min(e.mhp,e.hp+s.amt); Snd.sfx('heal');
    await bsay(`${e.name}の HPが ${e.hp-b} かいふくした！`);
  } else if(s.type==='buff'){
    if(e.buff>=1.5) await bsay('しかし なにも おこらなかった。');
    else { e.buff=Math.min(1.5,e.buff+0.25); await bsay(`${e.name}の こうげき力が あがった！`); }
  }
}
async function gainExp(amount){
  if(!amount) return;
  for(const m of G.party){
    m.exp+=amount;
    while(m.lv<40&&m.exp>=needExp(m.lv+1)){
      const before=stats(m), oldSk=skillsOf(m).map(s=>s.id);
      m.lv++;
      const after=stats(m);
      m.hp+=after.mhp-before.mhp; m.mp+=after.mmp-before.mmp;
      Snd.sfx('lvup'); statusUpdate();
      await bsay(`${nm(m)}は レベル${m.lv}に あがった！`,1100);
      for(const s of skillsOf(m)) if(!oldSk.includes(s.id)) await bsay(`${nm(m)}は ${s.name}を おぼえた！`,1000);
    }
  }
}

  await say('遠くで ニキの声が する。\n「沖縄に 行きたい」\n……なぜか HPと MPが 回復した！');
  save();
  const r=await battle(['jidai'],{boss:true,noRun:true,bg:'era'});
  if(r!=='win') return;
  await ending();
}
async function ending(){
  G.flags.cleared=true; save();
  await T('時代','ハジ…… ラン…… セヨ……');
  await say('時代は ゆっくりと うつりかわっていった。');
  await fade(1); msgHide(); G.scene='black'; G.portrait=null; Music.play('ending'); await fade(0,600);
  const N=t=>say(t,{narr:true});
  await N('人間界、 魔界、 そして 第三の勢力。\n各々の正義は いまも 闊歩している。');
  await N('それでも——');
  G.portrait={keys:['daayama','toyuT','yoki'],scale:5};
  await N('ダーヤマ、 ヨーキ、 トーユは\n世界を・・・ 時代を 相手に\n戦うのであった。');
  G.portrait=null;
  await N('一方、 このメインストーリーとは\n関係なく——');
  await fade(1); G.scene='okinawa'; await fade(0,600);
  await N('「とにかく沖縄に行きたいニキ」は……');
  await N('ついに 沖縄に ついた。');
  await say('……めんそーれ。（自分に）',{narr:true,name:'とにかく沖縄に行きたいニキ'});
  await fade(1); G.scene='black'; await fade(0,600);
  await say('ライツ・オブ・ヒューマニティ\n〜 おしまい 〜',{narr:true,big:true});
  await N('原作　Yutitong\nあそんでくれて ありがとう！');
  msgHide();
  await titleScreen();
}

/* ================= TITLE / BOOT ================= */
async function titleScreen(){
  G.scene='title'; G.fade=0; Music.play(Snd.ctx?'title':null);
  titleEl.hidden=false; $('#tpress').hidden=false;
  await waitKey(['A']);
  Snd.init(); Snd.sfx('tererein'); Music.play('title');
  $('#tpress').hidden=true;
  const sv=loadSave();
  const opts=sv?['つづきから','はじめから']:['はじめから'];
  const c=await choose(opts,{cancel:false,style:{left:'166px',top:'214px',minWidth:'180px'}});
  titleEl.hidden=true;
  if(opts[c]==='つづきから'){
    G.party=sv.party.map(p=>({...p,buff:1,guard:false})); G.inv=sv.inv||{}; G.gold=sv.gold||0; G.flags=sv.flags||{}; G.heal=sv.heal||{map:'lab',x:7,y:10};
    G.flags.yokiShow=false;
    await goto(sv.map||'lab',sv.x,sv.y,'D');
  } else {
    G.party=[mkMember('toyu',1)]; G.inv={dango:3}; G.gold=30; G.flags={}; G.heal={map:'lab',x:7,y:10};
    await fade(1); await prologue();
    await goto('lab',7,10,'U');
  }
}

/* ================= LOOP / RENDER ================= */
function update(dt){
  if(G.scene!=='map'||busy||ui.handler) return;
  if(G.moving){
    G.mt+=dt/150;
    if(G.mt>=1){ G.mt=0; G.moving=false; G.px=G.tx; G.py=G.ty; onStep(); }
    return;
  }
  const d=held.U?'U':held.D?'D':held.L?'L':held.R?'R':null;
  if(!d) return;
  G.dir=d;
  const [dx,dy]=DIRS[d], nx=G.px+dx, ny=G.py+dy;
  if(!passable(nx,ny)) return;
  const chain=[{x:G.px,y:G.py},...G.fol];
  G.folFrom=G.fol.map(p=>({x:p.x,y:p.y}));
  G.fol=G.fol.map((p,i)=>({x:chain[i].x,y:chain[i].y}));
  G.moving=true; G.mt=0; G.tx=nx; G.ty=ny;
}
function renderMap(){
  const m=G.map, mw=m.w*TS, mh=m.h*TS;
  let ppx=G.px*TS, ppy=G.py*TS;
  if(G.moving){ ppx+=(G.tx-G.px)*TS*G.mt; ppy+=(G.ty-G.py)*TS*G.mt; }
  const cx=Math.round(mw<=W?(mw-W)/2:clamp(ppx-W/2+8,0,mw-W));
  const cy=Math.round(mh<=H?(mh-H)/2:clamp(ppy-H/2+8,0,mh-H));
  const x0=Math.floor(cx/TS), y0=Math.floor(cy/TS);
  for(let ty=y0;ty<=y0+H/TS+1;ty++) for(let tx=x0;tx<=x0+W/TS+1;tx++){
    const ch=tileAt(tx,ty); drawTile(ch==null?m.out:ch,tx*TS-cx,ty*TS-cy,tx,ty);
  }
  const ents=[];
  for(const n of npcsOf()) if(n.spr) ents.push({k:n.spr,x:n.x*TS,y:n.y*TS,z:0,npc:true});
  const mt=G.moving?G.mt:1;
  G.fol.forEach((p,i)=>{ const mem=G.party[i+1]; if(!mem) return; const f=G.folFrom[i]||p; ents.push({k:sprOf(mem),x:lerp(f.x,p.x,mt)*TS,y:lerp(f.y,p.y,mt)*TS,z:-(i+1)}); });
  if(G.party[0]) ents.push({k:sprOf(G.party[0]),x:ppx,y:ppy,z:1});
  ents.sort((a,b)=>(a.y-b.y)||(a.z-b.z));
  const anim=Math.floor(G.time/280)%2===1;
  for(const e of ents) drawSpr(e.k,Math.round(e.x-cx),Math.round(e.y-cy),{flip:anim,back:!e.npc&&G.dir==='U'});
}
const BGS={
  field:['#1c2f5c','#2c4a84','#3f6aa8','#2f7d2c','#3f9a3a'],
  lab:['#20242e','#2c3240','#3a4254','#6a7080','#8a90a0'],
  fried:['#3a1e08','#5a3010','#7a4a18','#b07028','#d9973a'],
  castle:['#1c1828','#2a2438','#3a3250','#5a5070','#7a7090'],
  demon:['#0c0412','#1a0a24','#2a1438','#4a2a5a','#c88a1c'],
  era:['#06040e','#0c0820','#141030','#1c1438','#2a1c48'],
};
function renderBattle(){
  const c=BGS[B.bg]||BGS.field;
  const y0=60;
  ctx.fillStyle=c[0]; ctx.fillRect(8,y0,240,22);
  ctx.fillStyle=c[1]; ctx.fillRect(8,y0+22,240,22);
  ctx.fillStyle=c[2]; ctx.fillRect(8,y0+44,240,22);
  ctx.fillStyle=c[3]; ctx.fillRect(8,y0+66,240,12);
  ctx.fillStyle=c[4]; ctx.fillRect(8,y0+78,240,18);
  for(let x=8;x<248;x+=4){ ctx.fillStyle=c[3]; ctx.fillRect(x+((x/4)%2)*2,y0+78,2,1); }
  if(B.bg==='era'){
    for(let i=0;i<40;i++){ const h=hash(i,7); const x=8+((h&255)+G.frame*((h>>8)%3+1)*0.3)%240; const y=y0+((h>>12)%92); ctx.fillStyle=(h>>4)&1?'#f6efd8':'#8a7ab0'; ctx.fillRect(Math.floor(x),y,1,1); }
    ctx.strokeStyle='rgba(242,178,52,0.35)'; ctx.lineWidth=1;
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(128,108,22+i*14+(G.frame/3)%14,0,Math.PI*2); ctx.stroke(); }
  }
  if(B.bg==='demon'){ for(let i=0;i<6;i++){ const x=8+((i*47+G.frame)%240); ctx.fillStyle='#f2b234'; ctx.fillRect(x,y0+80+(i%3)*4,3,1); } }
  ctx.strokeStyle='#f6f1e4'; ctx.lineWidth=2; ctx.strokeRect(7,y0-1,242,98);
  for(const e of B.enemies){
    if(e.alpha<=0) continue;
    if(e.dying) e.alpha-=0.05;
    if(e.flash>0){ e.flash--; if((e.flash>>1)&1) continue; }
    const bob=e.dying?0:Math.round(Math.sin(G.time/300+e.x)*1);
    drawSpr(e.d.spr,e.x,e.y+bob,{scale:e.s,alpha:e.alpha});
  }
}
function drawStars(seed,n,maxY){
  for(let i=0;i<n;i++){ const h=hash(i,seed); const tw=((G.frame>>3)+i)%23===0; ctx.fillStyle=tw?'#ffffff':((h>>3)&1?'#cbbfe6':'#6a5a90'); ctx.fillRect(h%W,(h>>9)%maxY,1,1); }
}
function renderTitle(){
  const bands=['#0b0820','#120c2c','#1a1038','#221444','#2a1850'];
  bands.forEach((c,i)=>{ ctx.fillStyle=c; ctx.fillRect(0,i*41,W,41); });
  drawStars(3,90,190);
  const disk=(cx,cy,r,col)=>{ ctx.fillStyle=col; for(let dy=-r;dy<=r;dy++){ const hw=Math.round(Math.sqrt(r*r-dy*dy)); ctx.fillRect(cx-hw,cy+dy,hw*2,1); } };
  disk(222,26,9,'#f6efd8'); disk(227,23,8,'#0b0820');
  ctx.fillStyle='#c88a1c'; ctx.fillRect(0,202,W,38);
  for(let i=0;i<14;i++){ const x=(i*29+G.frame*0.4)%(W+20)-10; ctx.fillStyle='#f2b234'; ctx.fillRect(Math.floor(x),207+(i%3)*10,8,1); }
  if(G.frame%40<8){ ctx.fillStyle='#ffe08a'; ctx.fillRect(40+(G.frame%200),216,2,2); }
  ctx.fillStyle='#7a4410'; ctx.fillRect(72,194,112,12); ctx.fillStyle='#a86a18'; ctx.fillRect(68,190,120,6); ctx.fillStyle='#d8962a'; ctx.fillRect(76,188,104,3);
  const anim=Math.floor(G.time/400)%2===1;
  drawSpr('daayama',84,157,{scale:2,flip:anim});
  drawSpr('toyuT',112,157,{scale:2,flip:!anim});
  drawSpr('yoki',140,157,{scale:2,flip:anim});
}
function renderBlack(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  drawStars(11,30,140);
  const p=G.portrait; if(!p) return;
  const s=p.scale, n=p.keys.length, gap=10, tot=n*16*s+(n-1)*gap;
  let x=Math.round((W-tot)/2);
  const y=Math.round(110-16*s/2-10);
  const anim=Math.floor(G.time/400)%2===1;
  for(const k of p.keys){ drawSpr(k,x,y,{scale:s,flip:anim}); x+=16*s+gap; }
}
function renderOkinawa(){
  const sky=['#3aa0e0','#5ab4ea','#7ac8f2','#9adaf8'];
  sky.forEach((c,i)=>{ ctx.fillStyle=c; ctx.fillRect(0,i*30,W,30); });
  ctx.fillStyle='#fff6b0'; ctx.fillRect(196,18,22,22); ctx.fillStyle='#ffffff'; ctx.fillRect(200,22,6,6);
  ctx.fillStyle='#f6f6f6'; ctx.fillRect(30,30,30,6); ctx.fillRect(38,26,16,4); ctx.fillRect(120,46,26,5);
  ctx.fillStyle='#0a8ac0'; ctx.fillRect(0,104,W,18); ctx.fillStyle='#1aaad0'; ctx.fillRect(0,122,W,16); ctx.fillStyle='#4ad0e0'; ctx.fillRect(0,138,W,10);
  for(let i=0;i<10;i++){ const x=(i*31+G.frame*0.3)%W; ctx.fillStyle='#d8fbff'; ctx.fillRect(Math.floor(x),108+(i%3)*10,6,1); }
  ctx.fillStyle='#f0e0a8'; ctx.fillRect(0,148,W,92); ctx.fillStyle='#e0cc90'; for(let i=0;i<30;i++){ const h=hash(i,99); ctx.fillRect(h%W,152+(h>>9)%84,2,1); }
  ctx.fillStyle='#8a5a2a'; for(let i=0;i<60;i++) ctx.fillRect(40+Math.floor(i/6),176-i,4,1);
  ctx.fillStyle='#2a9a3a'; ctx.fillRect(28,112,40,6); ctx.fillRect(22,118,12,6); ctx.fillRect(62,118,14,6); ctx.fillRect(40,106,18,6);
  drawSpr('niki',112,92,{scale:4,flip:Math.floor(G.time/500)%2===1});
}
let last=performance.now();
function loop(now){
  const dt=Math.min(50,now-last); last=now; G.time+=dt; G.frame++;
  update(dt);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(G.shake>0){ G.shake--; ctx.translate(rnd(-2,2),rnd(-2,2)); }
  if(G.scene==='map'&&G.map) renderMap();
  else if(G.scene==='battle'&&B) renderBattle();
  else if(G.scene==='title') renderTitle();
  else if(G.scene==='okinawa') renderOkinawa();
  else renderBlack();
  ctx.restore();
  if(G.flash>0){ ctx.globalAlpha=G.flash; ctx.fillStyle=G.flashColor; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(G.fade>0){ ctx.globalAlpha=Math.min(1,G.fade); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  requestAnimationFrame(loop);
}

fit();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
requestAnimationFrame(loop);
run(titleScreen);
})();
</script>
